<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Gestionale · Jeremias Barbiere</title>
<style>
@font-face{font-family:'Oswald';src:url({{ASSET:oswald.woff2}}) format('woff2');font-weight:400 700;font-display:swap}
@font-face{font-family:'Inter';src:url({{ASSET:inter.woff2}}) format('woff2');font-weight:400 800;font-display:swap}

:root{
  --verde:#93C01F; --verde-s:#7BA318; --verde-t:#12160B;
  --petrolio:#0F7E9B; --petrolio-s:#0B6178;
  --nero:#16181A; --nero-2:#22262A; --nero-3:#2C3136;
  --bg:#F2F1ED; --card:#FFFFFF; --card2:#FAF9F6;
  --tx:#16181A; --tx2:#4E555B; --tx3:#8A9299;
  --bord:#E3E1DB; --om:rgba(22,24,26,.12);
  --ok:#2E8B57; --ko:#C0392B; --att:#C77D0A;
  --lato:250px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--tx);
  font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
h1,h2,h3,h4,.os{font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;
  letter-spacing:.02em;line-height:1.1}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
img{max-width:100%;display:block}
:focus-visible{outline:2.5px solid var(--verde);outline-offset:2px}

/* ---------- colonna ---------- */
.lato{position:fixed;left:0;top:0;bottom:0;width:var(--lato);background:var(--nero);color:#fff;
  display:flex;flex-direction:column;padding:16px 13px;z-index:70;overflow-y:auto}
.lato .cap{display:flex;align-items:center;gap:11px;padding:4px 6px 16px;
  border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:12px}
.lato .cap .logo{width:42px;height:42px;border-radius:99px;background:#fff;padding:3px;flex:none}
.lato .cap b{font-family:'Oswald',sans-serif;font-size:.98rem;text-transform:uppercase;display:block;
  line-height:1.1;letter-spacing:.04em}
.lato .cap small{font-size:.7rem;color:rgba(255,255,255,.45);letter-spacing:.1em;text-transform:uppercase}
.lato nav{display:grid;gap:2px}
.lato nav .grp{font-size:.64rem;letter-spacing:.18em;text-transform:uppercase;
  color:rgba(255,255,255,.3);padding:14px 8px 6px;font-weight:700}
.lato nav button{display:flex;align-items:center;gap:11px;width:100%;padding:.62em .7em;border-radius:6px;
  text-align:left;font-size:.9rem;color:rgba(255,255,255,.72);transition:.14s}
.lato nav button:hover{background:rgba(255,255,255,.09);color:#fff}
.lato nav button.on{background:var(--verde);color:var(--verde-t);font-weight:600}
.lato nav button svg{width:18px;height:18px;flex:none}
.lato nav button .n[hidden]{display:none}
.lato nav button .n{margin-left:auto;background:var(--ko);color:#fff;font-size:.68rem;font-weight:700;
  min-width:19px;height:19px;border-radius:99px;display:grid;place-items:center;padding:0 5px}
.lato nav button.on .n{background:var(--nero);color:#fff}
.lato .chi{margin-top:auto;padding-top:12px;border-top:1px solid rgba(255,255,255,.12);
  display:flex;align-items:center;gap:10px}
.lato .chi .t{width:34px;height:34px;border-radius:99px;background:var(--verde);color:var(--verde-t);
  display:grid;place-items:center;font-family:'Oswald',sans-serif;font-size:.8rem;flex:none}
.lato .chi b{font-size:.84rem;display:block;line-height:1.2}
.lato .chi small{font-size:.71rem;color:rgba(255,255,255,.45)}

.corpo{margin-left:var(--lato);min-height:100vh;display:flex;flex-direction:column}
.barra{display:flex;align-items:center;gap:13px;padding:13px 22px;background:var(--card);
  border-bottom:1px solid var(--bord);position:sticky;top:0;z-index:50;flex-wrap:wrap}
.barra h1{font-size:1.3rem}
.barra .data{font-size:.8rem;color:var(--tx3)}
.barra .dx{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.burger{display:none;width:40px;height:40px;border-radius:6px;background:var(--nero);color:#fff;
  place-items:center;flex:none}
.pagina{padding:20px 22px 40px;flex:1}
.pagina[hidden]{display:none}

/* ---------- pezzi ---------- */
.b{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:.55em 1em;
  border-radius:6px;font-weight:700;font-size:.85rem;cursor:pointer;border:1.5px solid transparent;
  transition:.16s;white-space:nowrap}
.b svg{width:16px;height:16px}
.b-p{background:var(--verde);color:var(--verde-t)}
.b-p:hover{background:var(--verde-s)}
.b-n{background:var(--nero);color:#fff}
.b-n:hover{background:var(--nero-2)}
.b-s{border-color:var(--bord);background:var(--card)}
.b-s:hover{border-color:var(--nero)}
.b-ko{border-color:var(--bord);color:var(--ko);background:var(--card)}
.b-ko:hover{background:var(--ko);color:#fff;border-color:var(--ko)}
.b-sm{padding:.38em .75em;font-size:.79rem;border-radius:5px}
.b[disabled]{opacity:.4;pointer-events:none}

.card{background:var(--card);border:1px solid var(--bord);border-radius:10px;padding:18px}
.griglia{display:grid;gap:14px}
.griglia>*{min-width:0}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}

.kpi{background:var(--card);border:1px solid var(--bord);border-radius:10px;padding:15px 17px;position:relative}
.kpi .et{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);font-weight:700}
.kpi b{display:block;font-family:'Oswald',sans-serif;font-size:1.95rem;font-weight:600;margin:4px 0 1px}
.kpi small{font-size:.78rem;color:var(--tx2)}
.kpi .bar{height:5px;border-radius:99px;background:var(--bord);margin-top:9px;overflow:hidden}
.kpi .bar i{display:block;height:100%;background:var(--verde)}

.tit{display:flex;align-items:center;gap:11px;justify-content:space-between;margin-bottom:13px;flex-wrap:wrap}
.tit h2{font-size:1.02rem}
.tit .sx{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

table{width:100%;border-collapse:collapse;font-size:.86rem}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--bord)}
thead th{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);font-weight:700;
  white-space:nowrap}
tbody tr{cursor:pointer;transition:.14s}
tbody tr:hover{background:var(--card2)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tab-scorri{overflow-x:auto;min-width:0}
@media(max-width:820px){.tab-scorri table{min-width:600px}}

.eti{display:inline-flex;align-items:center;gap:5px;padding:.2em .55em;border-radius:99px;
  font-size:.72rem;font-weight:700;white-space:nowrap}
.eti-ok{background:rgba(46,139,87,.13);color:var(--ok)}
.eti-att{background:rgba(199,125,10,.14);color:var(--att)}
.eti-ko{background:rgba(192,57,43,.12);color:var(--ko)}
.eti-neu{background:var(--card2);color:var(--tx2);border:1px solid var(--bord)}
.eti-web{background:rgba(15,126,155,.13);color:var(--petrolio)}

.filtri{display:flex;gap:6px;flex-wrap:wrap}
.filtri button{padding:.34em .78em;border-radius:99px;border:1.5px solid var(--bord);font-size:.79rem;
  font-weight:600;background:var(--card);transition:.14s}
.filtri button:hover{border-color:var(--nero)}
.filtri button.on{background:var(--nero);color:#fff;border-color:var(--nero)}

.campo{margin-bottom:11px}
.campo label{display:block;font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--tx3);margin-bottom:4px}
.campo input,.campo select,.campo textarea{width:100%;padding:.55em .75em;border-radius:6px;
  border:1.5px solid var(--bord);background:var(--card2);font-size:.89rem}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:none;border-color:var(--verde);background:var(--card)}

.vuoto{padding:30px;text-align:center;color:var(--tx3);font-size:.87rem}
.nota{font-size:.79rem;color:var(--tx3);padding:12px 14px;border-radius:8px;background:var(--card2);
  border:1px dashed var(--bord);line-height:1.5}

/* ---------- AGENDA ---------- */
.agenda{display:grid;grid-template-columns:62px 1fr 1fr;border:1px solid var(--bord);
  border-radius:10px;overflow:hidden;background:var(--card)}
.agenda .col-t{background:var(--card2);border-right:1px solid var(--bord)}
.agenda .testa-col{padding:11px;text-align:center;border-bottom:1px solid var(--bord);
  border-right:1px solid var(--bord);position:sticky;top:56px;background:var(--card);z-index:5}
.agenda .testa-col b{font-family:'Oswald',sans-serif;font-size:1.02rem;display:block}
.agenda .testa-col small{font-size:.74rem;color:var(--tx3)}
.agenda .ora-et{height:46px;font-size:.72rem;color:var(--tx3);text-align:right;padding:2px 8px 0 0;
  border-bottom:1px solid var(--bord);font-variant-numeric:tabular-nums}
.agenda .cella{height:46px;border-bottom:1px solid var(--bord);border-right:1px solid var(--bord);
  position:relative;cursor:pointer;transition:.12s}
.agenda .cella:hover{background:color-mix(in srgb,var(--verde) 12%,transparent)}
.agenda .cella.fuori{background:repeating-linear-gradient(45deg,var(--card2),var(--card2) 6px,
  #EDECE7 6px,#EDECE7 12px);cursor:not-allowed}
.app{position:absolute;left:3px;right:3px;top:2px;border-radius:6px;padding:6px 8px;
  background:var(--nero);color:#fff;font-size:.78rem;overflow:hidden;z-index:2;cursor:pointer;
  border-left:4px solid var(--verde)}
.app.web{border-left-color:var(--petrolio)}
.app.fatto{background:var(--nero-3);opacity:.72}
.app.annullata{background:#7A2E27;opacity:.6;text-decoration:line-through}
.app b{display:block;font-weight:700;font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app small{opacity:.72;font-size:.72rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- assistente ---------- */
.assist{background:var(--nero);color:#fff;border-radius:10px;padding:17px}
.assist .a-top{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.assist .a-top svg{width:19px;height:19px;color:var(--verde)}
.assist .a-top h2{font-size:1rem}
.assist .a-top span{margin-left:auto;font-size:.74rem;opacity:.55}
.cons{background:rgba(255,255,255,.07);border-radius:8px;padding:13px 14px;margin-bottom:9px}
.cons:last-child{margin-bottom:0}
.cons .r1{display:flex;gap:9px;justify-content:space-between;align-items:flex-start}
.cons h4{font-size:.92rem;font-family:'Inter',sans-serif;text-transform:none;font-weight:700;line-height:1.3}
.cons p{font-size:.83rem;opacity:.76;margin-top:4px;line-height:1.45}
.cons .az{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.cons .az button{padding:.35em .8em;border-radius:6px;font-size:.79rem;font-weight:600;
  background:rgba(255,255,255,.14);color:#fff;transition:.14s}
.cons .az button:hover{background:rgba(255,255,255,.26)}
.cons .az button.forte{background:var(--verde);color:var(--verde-t)}
.tag{font-size:.64rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:.2em .5em;
  border-radius:4px;flex:none}
.tag-urg{background:var(--ko);color:#fff}
.tag-oggi{background:var(--verde);color:var(--verde-t)}
.tag-info{background:rgba(255,255,255,.16);color:#fff}

/* ---------- incassi ---------- */
.barre{display:flex;align-items:flex-end;gap:7px;height:150px;padding-top:8px}
.barre div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;
  justify-content:flex-end}
.barre i{width:100%;border-radius:5px 5px 0 0;display:block;min-height:3px;background:var(--nero)}
.barre i.prev{background:repeating-linear-gradient(45deg,var(--verde),var(--verde) 5px,
  var(--verde-s) 5px,var(--verde-s) 10px)}
.barre small{font-size:.68rem;color:var(--tx3)}
.quota{display:flex;height:30px;border-radius:6px;overflow:hidden;margin-top:9px;font-size:.75rem;
  font-weight:700}
.quota span{display:grid;place-items:center;color:#fff;min-width:38px}
.quota .j{background:var(--nero)}
.quota .l{background:var(--petrolio)}

/* ---------- whatsapp ---------- */
.wa{display:grid;grid-template-columns:300px 1fr;border:1px solid var(--bord);border-radius:10px;
  overflow:hidden;background:var(--card);height:min(600px,70vh)}
.wa-el{border-right:1px solid var(--bord);overflow-y:auto;background:var(--card2)}
.wa-c{display:flex;gap:10px;padding:12px 13px;border-bottom:1px solid var(--bord);cursor:pointer}
.wa-c:hover,.wa-c.on{background:var(--card)}
.wa-c.on{border-left:3px solid var(--verde);padding-left:10px}
.wa-c .t{width:36px;height:36px;border-radius:99px;background:var(--nero);color:#fff;display:grid;
  place-items:center;font-family:'Oswald',sans-serif;font-size:.78rem;flex:none}
.wa-c .tx{min-width:0;flex:1}
.wa-c b{font-size:.86rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wa-c small{font-size:.77rem;color:var(--tx3);display:block;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.wa-c .n{background:#25D366;color:#fff;font-size:.68rem;font-weight:700;border-radius:99px;
  min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px;flex:none;align-self:center}
.wa-t{display:flex;flex-direction:column;min-width:0}
.wa-t .top{display:flex;align-items:center;gap:10px;padding:12px 15px;border-bottom:1px solid var(--bord);
  flex-wrap:wrap}
.wa-msg{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:8px;background:var(--card2)}
.wa-b{max-width:76%;padding:8px 12px;border-radius:12px;font-size:.86rem;line-height:1.45}
.wa-b.cli{background:var(--card);border:1px solid var(--bord);align-self:flex-start;border-bottom-left-radius:3px}
.wa-b.noi{background:#DCF8C6;color:#16181A;align-self:flex-end;border-bottom-right-radius:3px}
.wa-b.sis{align-self:center;background:transparent;border:1px dashed var(--bord);color:var(--tx3);
  font-size:.75rem;border-radius:99px;padding:4px 11px}
.wa-b .chi{display:block;font-size:.69rem;opacity:.6;font-weight:700;margin-bottom:2px}
.wa-p{display:flex;gap:7px;padding:10px 13px;border-top:1px solid var(--bord);background:var(--card)}
.wa-p input{flex:1;padding:.55em .85em;border-radius:99px;border:1.5px solid var(--bord);
  background:var(--card2);font-size:.87rem}
.wa-p input:focus{outline:none;border-color:var(--verde)}
.wa-p button{width:38px;height:38px;border-radius:99px;background:#25D366;color:#fff;display:grid;
  place-items:center;flex:none}
.wa-rap{display:flex;gap:6px;padding:9px 13px 0;flex-wrap:wrap;background:var(--card)}
.wa-rap button{padding:.32em .75em;border-radius:99px;border:1.5px solid var(--bord);font-size:.77rem;
  background:var(--card2)}

/* ---------- cassetto ---------- */
.cass{position:fixed;right:0;top:0;bottom:0;width:min(400px,94vw);background:var(--card);
  border-left:1px solid var(--bord);box-shadow:-18px 0 50px -20px var(--om);z-index:80;
  transform:translateX(101%);transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;
  flex-direction:column}
.cass.on{transform:none}
.cass .c-top{padding:16px 18px;border-bottom:1px solid var(--bord);display:flex;gap:11px;align-items:flex-start}
.cass .c-corpo{flex:1;overflow-y:auto;padding:16px 18px}
.cass .c-piede{padding:12px 18px;border-top:1px solid var(--bord);display:flex;gap:7px;flex-wrap:wrap}
.velo{position:fixed;inset:0;background:rgba(10,12,13,.4);z-index:75;opacity:0;pointer-events:none;transition:.28s}
.velo.on{opacity:1;pointer-events:auto}
.dato{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--bord);
  font-size:.86rem}
.dato:last-child{border:none}
.dato span:first-child{color:var(--tx3)}
.dato span:last-child{text-align:right;font-weight:600}

.toast{position:fixed;left:50%;transform:translate(-50%,14px);bottom:20px;z-index:95;background:var(--nero);
  color:#fff;padding:12px 17px;border-radius:8px;font-size:.86rem;max-width:min(460px,92vw);
  box-shadow:0 18px 40px -14px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.27s;
  border-left:4px solid var(--verde)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}

@media(max-width:1080px){ .g4{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:1fr}
  .pagina .griglia[style]{grid-template-columns:1fr!important} }
@media(max-width:900px){
  :root{--lato:0px}
  .lato{transform:translateX(-101%);transition:transform .3s;width:262px}
  .lato.on{transform:none}
  .corpo{margin-left:0}
  .burger{display:grid}
  .g2{grid-template-columns:1fr}
  .wa{grid-template-columns:1fr;height:auto}
  .wa-el{max-height:230px;border-right:none;border-bottom:1px solid var(--bord)}
  .wa-msg{height:320px}
  .agenda{grid-template-columns:52px 1fr 1fr;font-size:.9em}
  .pagina{padding:16px 13px 30px}
  .barra{padding:11px 13px}
}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>
