<!DOCTYPE html>
<html lang="it" data-tema="mare">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Bagni Tortuga · Andora</title>
<meta name="description" content="Lido di sabbia dorata sul Mar Ligure, nel centro di Andora. Prenota il tuo ombrellone scegliendolo sulla mappa della spiaggia.">
<style>
@font-face{font-family:'Pinyon';src:url({{ASSET:pinyon-400.woff2}}) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Syne';src:url({{ASSET:syne-400.woff2}}) format('woff2');font-weight:400 800;font-display:swap}
@font-face{font-family:'Questrial';src:url({{ASSET:questrial-400.woff2}}) format('woff2');font-weight:400;font-display:swap}

/* ======================= COLORI ·  presi dal marchio e dagli ombrelloni veri ======================= */
:root{
  --acc:#EFB402; --acc-s:#CE9C02; --acc-t:#0B2431;
  --deep:#014364; --deep-s:#01304A; --deep-t:#FFFFFF;
  --bg:#FAF4E8; --bg2:#FFFDF6; --card:#FFFFFF;
  --tx:#0B2431; --tx2:#3F5768; --tx3:#7F919E;
  --bord:rgba(1,67,100,.16); --om:rgba(1,67,100,.12);
  --wrap:1180px; --r:14px; --r2:22px; --barra:74px; }

/* ======================= BASE ======================= */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:'Questrial',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--tx);line-height:1.62;font-size:16.5px;
  overflow-x:hidden;transition:background .5s ease,color .5s ease;
  padding-bottom:calc(var(--barra) + env(safe-area-inset-bottom,0px))}
h1,h2,h3,h4,.sy{font-family:'Syne',system-ui,sans-serif;font-weight:700;line-height:1.14;letter-spacing:-.02em}
h1{font-size:clamp(2.6rem,7vw,4.6rem);font-weight:800}
h2{font-size:clamp(1.9rem,4.2vw,3rem)}
h3{font-size:1.16rem;font-weight:700;letter-spacing:-.01em}
p{color:var(--tx2)}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
img{max-width:100%;display:block}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
::selection{background:var(--acc);color:var(--acc-t)}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:3px;border-radius:4px}

.wrap{max-width:var(--wrap);margin:0 auto;padding:0 22px}
.stretto{max-width:900px}
.sez{padding:86px 0;position:relative}
.sez-alt{background:var(--bg2)}
.sez-deep{background:var(--deep);color:var(--deep-t)}
.sez-deep p{color:rgba(255,255,255,.72)}
.centro{text-align:center}

/* marchio */
.marchio{display:flex;align-items:center;gap:11px}
.marchio .segno{width:44px;height:44px;flex:none;border-radius:99px;overflow:hidden;
  background:var(--bg2);box-shadow:0 2px 10px -3px var(--om)}
.marchio .segno img{width:100%;height:100%;object-fit:cover}
.marchio .nome{font-family:'Pinyon',cursive;font-size:1.72rem;line-height:1;
  color:var(--deep);white-space:nowrap;padding-top:.12em}
.sez-deep .marchio .nome,.piede .marchio .nome{color:var(--deep-t)}

/* occhiello e testate */
.occhiello{font-family:'Syne',sans-serif;font-weight:700;font-size:.7rem;letter-spacing:.24em;
  text-transform:uppercase;color:var(--acc-s);display:flex;align-items:center;gap:10px}
.sez-deep .occhiello{color:var(--acc)}
.occhiello .num{font-variant-numeric:tabular-nums;opacity:.5}
.occhiello::after{content:"";height:1px;flex:1;max-width:70px;background:currentColor;opacity:.4}
.testa{max-width:640px;margin-bottom:44px}
.testa h2{margin:14px 0 12px}
.testa.mid{margin-left:auto;margin-right:auto;text-align:center}
.testa.mid .occhiello{justify-content:center}
.testa.mid .occhiello::before{content:"";height:1px;flex:1;max-width:70px;background:currentColor;opacity:.4}

/* bottoni */
.b{display:inline-flex;align-items:center;justify-content:center;gap:9px;
  padding:.86em 1.5em;border-radius:99px;font-family:'Syne',sans-serif;font-weight:700;
  font-size:.93rem;letter-spacing:-.01em;cursor:pointer;border:1.5px solid transparent;
  transition:transform .18s,box-shadow .18s,background .3s,color .3s;white-space:nowrap}
.b:hover{transform:translateY(-2px)}
.b:active{transform:translateY(0)}
.b svg{width:17px;height:17px}
.b-p{background:var(--acc);color:var(--acc-t);box-shadow:0 6px 18px -6px var(--acc)}
.b-p:hover{background:var(--acc-s)}
.b-d{background:var(--deep);color:var(--deep-t)}
.b-d:hover{background:var(--deep-s)}
.b-s{border-color:var(--bord);color:var(--tx)}
.b-s:hover{border-color:var(--acc);color:var(--acc-s)}
.sez-deep .b-s{border-color:rgba(255,255,255,.3);color:#fff}
.b-sm{padding:.6em 1.05em;font-size:.83rem}
.b[disabled]{opacity:.45;pointer-events:none}

/* schede */
.scheda{background:var(--card);border:1px solid var(--bord);border-radius:var(--r2);padding:26px;
  transition:background .5s,border-color .5s}
.griglia{display:grid;gap:20px}
.griglia>*{min-width:0}   /* senza questo una colonna con dentro la mappa allarga tutta la pagina */
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}

/* ======================= BARRA DI NAVIGAZIONE IN BASSO ======================= */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom,0px));
  z-index:80;display:flex;align-items:center;gap:4px;padding:7px;border-radius:99px;
  background:color-mix(in srgb,var(--card) 86%,transparent);backdrop-filter:blur(18px) saturate(1.5);
  -webkit-backdrop-filter:blur(18px) saturate(1.5);
  border:1px solid var(--bord);box-shadow:0 14px 40px -12px var(--om),0 2px 6px -2px var(--om);
  max-width:calc(100vw - 20px);overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px 13px;border-radius:99px;font-size:.66rem;font-family:'Syne',sans-serif;font-weight:600;
  color:var(--tx2);transition:background .2s,color .2s;letter-spacing:.01em}
.nav a svg{width:19px;height:19px}
.nav a:hover{color:var(--acc-s)}
.nav a.on{background:var(--deep);color:var(--deep-t)}
.nav .sep{width:1px;height:26px;background:var(--bord);flex:none;margin:0 3px}
.nav .cta{background:var(--acc);color:var(--acc-t)}
.nav .cta:hover{background:var(--acc-s);color:var(--acc-t)}

/* testata in alto: solo marchio e strumenti */
.top{position:fixed;top:0;left:0;right:0;z-index:70;display:flex;align-items:center;
  justify-content:space-between;gap:14px;padding:14px 22px;transition:.35s;
  background:transparent}
.top.giu{background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--bord);padding:9px 22px}
.top .strumenti{display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:.45em .9em;border-radius:99px;
  border:1px solid var(--bord);background:color-mix(in srgb,var(--card) 75%,transparent);
  font-size:.78rem;font-family:'Syne',sans-serif;font-weight:600;cursor:pointer;transition:.2s}
.chip:hover{border-color:var(--acc);color:var(--acc-s)}
.chip svg{width:15px;height:15px}
.top .marchio .nome{font-size:1.5rem}
.hero-top .marchio .nome,.hero-top .marchio .segno{color:#fff}

/* ======================= APERTURA ======================= */
.hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;
  padding:110px 0 calc(var(--barra) + 34px);overflow:hidden}
.hero .sfondo{position:absolute;inset:0;background-size:cover;background-position:center 42%}
.hero .velo{position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(4,22,36,.52) 0%,rgba(4,22,36,.15) 32%,rgba(4,22,36,.78) 100%)}
.hero .wrap{position:relative;z-index:2;width:100%;color:#fff}
.hero .stemma{width:132px;height:132px;border-radius:99px;margin-bottom:22px;
  box-shadow:0 18px 44px -14px rgba(0,0,0,.5);background:var(--bg2)}
.hero h1{color:#fff;text-shadow:0 2px 30px rgba(0,0,0,.3)}
.hero .paga{font-family:'Pinyon',cursive;font-size:clamp(1.6rem,3.8vw,2.5rem);color:var(--acc);
  line-height:1.3;margin-bottom:6px;text-shadow:0 2px 16px rgba(2,16,26,.75),0 1px 3px rgba(2,16,26,.6)}
.hero .b-s{border-color:rgba(255,255,255,.6);color:#fff;
  background:rgba(255,255,255,.08);backdrop-filter:blur(4px)}
.hero .b-s:hover{border-color:#fff;color:#fff;background:rgba(255,255,255,.18)}
.hero .sotto{color:rgba(255,255,255,.9);max-width:520px;margin:20px 0 30px;font-size:1.06rem}
.hero .azioni{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.hero .dati{display:flex;gap:30px;flex-wrap:wrap;margin-top:46px;
  padding-top:26px;border-top:1px solid rgba(255,255,255,.22)}
.hero .dati div{min-width:96px}
.hero .dati b{display:block;font-family:'Syne',sans-serif;font-size:1.6rem;font-weight:800;color:#fff}
.hero .dati span{font-size:.79rem;color:rgba(255,255,255,.72);letter-spacing:.04em}
.scendi{position:absolute;right:26px;bottom:56px;z-index:2;color:#fff;opacity:.75;
  display:flex;flex-direction:column;align-items:center;gap:8px;font-size:.7rem;letter-spacing:.2em;
  writing-mode:vertical-rl;animation:fluttua 2.6s ease-in-out infinite}
@keyframes fluttua{0%,100%{transform:translateY(0)}50%{transform:translateY(9px)}}

.velo-pal{position:fixed;inset:0;background:rgba(6,20,30,.4);z-index:90;opacity:0;pointer-events:none;
  transition:opacity .35s;backdrop-filter:blur(2px)}
.velo-pal.on{opacity:1;pointer-events:auto}

/* ======================= MAPPA SPIAGGIA ======================= */
.mappa-guscio{background:var(--card);border:1px solid var(--bord);border-radius:var(--r2);
  padding:18px;position:relative}
.mappa-testa{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;
  margin-bottom:14px}
.legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--tx2);min-width:0}
.legenda span{display:flex;align-items:center;gap:6px}
.legenda i{width:13px;height:13px;border-radius:4px;display:block;flex:none}
.mappa-scorri{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;
  border-radius:var(--r);background:var(--bg2)}
.mappa-scorri svg{width:100%;min-width:620px;height:auto;stroke:none;display:block}
#mappa .omb{cursor:pointer}
#mappa .omb:focus{outline:none}
#mappa .omb:focus-visible .disco{transform:scale(1.16)}
#mappa .omb .disco{transition:transform .18s}
#mappa .omb:hover .disco{transform:scale(1.14)}
#mappa .omb.occ{cursor:not-allowed}
#mappa .et{font-family:'Syne',sans-serif;font-size:8px;font-weight:700;fill:var(--tx3);
  text-anchor:middle;pointer-events:none;user-select:none}
.mappa-info{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px;
  font-size:.83rem;color:var(--tx2)}

/* avviso bambini */
.avviso{position:fixed;left:50%;transform:translate(-50%,18px);bottom:calc(var(--barra) + 22px);
  z-index:88;width:min(430px,calc(100vw - 28px));background:var(--card);border:1px solid var(--bord);
  border-left:5px solid var(--acc);border-radius:var(--r);padding:17px 19px;
  box-shadow:0 22px 50px -16px var(--om);opacity:0;pointer-events:none;transition:.32s}
.avviso.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.avviso h4{font-family:'Syne',sans-serif;font-size:.98rem;margin-bottom:5px;display:flex;
  align-items:center;gap:8px}
.avviso h4 svg{width:18px;height:18px;color:var(--acc-s);flex:none}
.avviso p{font-size:.86rem;line-height:1.5}
.avviso .az{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}

/* ======================= FORM ======================= */
.campo{margin-bottom:15px}
.campo label{display:block;font-size:.78rem;font-family:'Syne',sans-serif;font-weight:600;
  color:var(--tx2);margin-bottom:6px;letter-spacing:.02em}
.campo input,.campo select,.campo textarea{width:100%;padding:.76em .95em;border-radius:11px;
  border:1.5px solid var(--bord);background:var(--bg2);transition:.2s;font-size:.95rem}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:none;border-color:var(--acc);
  background:var(--card)}
.campo .err{display:none;color:#C0392B;font-size:.76rem;margin-top:4px}
.campo.ko input,.campo.ko select{border-color:#C0392B}
.campo.ko .err{display:block}
.opzioni{display:flex;gap:8px;flex-wrap:wrap}
.opzioni button{padding:.55em 1em;border-radius:99px;border:1.5px solid var(--bord);
  font-size:.85rem;transition:.2s;font-family:'Syne',sans-serif;font-weight:600}
.opzioni button:hover{border-color:var(--acc)}
.opzioni button.on{background:var(--deep);color:var(--deep-t);border-color:var(--deep)}
.interruttore{display:flex;align-items:center;gap:11px;padding:13px;border-radius:var(--r);
  border:1.5px solid var(--bord);cursor:pointer;transition:.2s}
.interruttore:hover{border-color:var(--acc)}
.interruttore .box{width:22px;height:22px;border-radius:7px;border:1.8px solid var(--bord);
  flex:none;display:grid;place-items:center;transition:.2s}
.interruttore.on .box{background:var(--acc);border-color:var(--acc)}
.interruttore.on .box svg{color:var(--acc-t);width:13px;height:13px}
.interruttore .box svg{opacity:0}
.interruttore.on .box svg{opacity:1}
.interruttore small{display:block;color:var(--tx3);font-size:.78rem;line-height:1.4}

/* riepilogo */
.riga-r{display:flex;justify-content:space-between;gap:14px;padding:9px 0;font-size:.9rem;
  border-bottom:1px dashed var(--bord)}
.riga-r:last-child{border:none}
.riga-r.tot{font-family:'Syne',sans-serif;font-weight:800;font-size:1.16rem;padding-top:14px;
  border-top:1.5px solid var(--bord);border-bottom:none;margin-top:6px}

/* listino */
.tab{width:100%;border-collapse:collapse;font-size:.9rem}
.tab th,.tab td{padding:12px 10px;text-align:right;border-bottom:1px solid var(--bord)}
.tab th:first-child,.tab td:first-child{text-align:left}
.tab thead th{font-family:'Syne',sans-serif;font-weight:700;font-size:.74rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--tx3)}
.tab tbody tr:hover{background:var(--bg2)}
.tab td b{font-family:'Syne',sans-serif}
.tab .fila{display:flex;align-items:center;gap:9px}
.tab .fila i{width:11px;height:11px;border-radius:99px;display:block;flex:none;background:var(--acc)}

/* servizi */
.serv{display:flex;gap:14px;align-items:flex-start;padding:18px 0;border-bottom:1px solid var(--bord)}
.serv .ic{width:42px;height:42px;border-radius:13px;flex:none;display:grid;place-items:center;
  background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc-s)}
.serv h3{margin-bottom:3px}
.serv p{font-size:.89rem}

/* giornata */
.ora{display:grid;grid-template-columns:78px 1fr;gap:18px;padding:16px 0;
  border-bottom:1px solid var(--bord)}
.ora b{font-family:'Syne',sans-serif;font-size:1.02rem;color:var(--acc-s)}
.ora h3{font-size:1.02rem;margin-bottom:3px}
.ora p{font-size:.88rem}

/* galleria */
.gal{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.gal figure{position:relative;overflow:hidden;border-radius:var(--r);cursor:zoom-in;
  background-size:cover;background-position:center}
.gal figure::after{content:"";display:block;padding-top:72%}
.gal figure div{position:absolute;inset:0;background-size:cover;
  background-position:center;transition:transform .7s cubic-bezier(.2,.6,.2,1)}
.gal figure:hover div{transform:scale(1.06)}
.gal figcaption{position:absolute;left:0;right:0;bottom:0;padding:26px 14px 12px;color:#fff;
  font-size:.79rem;line-height:1.35;opacity:0;transition:opacity .3s;
  background:linear-gradient(180deg,transparent,rgba(3,18,28,.82))}
.gal figure:hover figcaption,.gal figure:focus-within figcaption{opacity:1}
.lente-dida{position:absolute;left:0;right:0;bottom:26px;text-align:center;color:rgba(255,255,255,.85);
  font-size:.86rem;padding:0 26px}

/* la foto dall'alto sopra la mappa */
.dallalto{position:relative;border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.dallalto img{width:100%;height:clamp(120px,17vw,190px);object-fit:cover;object-position:center 42%}
.dallalto span{position:absolute;left:0;right:0;bottom:0;padding:22px 14px 10px;color:#fff;
  font-size:.78rem;background:linear-gradient(180deg,transparent,rgba(3,18,28,.8))}
.lente{position:fixed;inset:0;background:rgba(4,16,26,.94);z-index:120;display:none;
  place-items:center;padding:26px}
.lente.on{display:grid}
.lente img{max-width:min(1200px,94vw);max-height:88vh;border-radius:10px;object-fit:contain}
.lente .x{position:absolute;top:20px;right:24px;color:#fff;width:44px;height:44px;border-radius:99px;
  background:rgba(255,255,255,.14);display:grid;place-items:center}

/* chat */
.chat-b{position:fixed;right:18px;bottom:calc(var(--barra) + 26px);z-index:86;width:56px;height:56px;
  border-radius:99px;background:var(--deep);color:var(--deep-t);display:grid;place-items:center;
  box-shadow:0 14px 34px -10px var(--om);transition:transform .2s}
.chat-b:hover{transform:scale(1.07)}
.chat-b svg{width:24px;height:24px}
.chat-b .pallino{position:absolute;top:2px;right:2px;width:13px;height:13px;border-radius:99px;
  background:var(--acc);border:2.5px solid var(--card)}
.chat{position:fixed;right:18px;bottom:calc(var(--barra) + 26px);z-index:87;
  width:min(392px,calc(100vw - 26px));height:min(560px,calc(100svh - var(--barra) - 60px));
  background:var(--card);border:1px solid var(--bord);border-radius:var(--r2);
  box-shadow:0 30px 70px -20px var(--om);display:flex;flex-direction:column;overflow:hidden;
  opacity:0;transform:translateY(14px) scale(.97);pointer-events:none;transition:.28s}
.chat.on{opacity:1;transform:none;pointer-events:auto}
.chat .c-top{display:flex;align-items:center;gap:11px;padding:14px 16px;background:var(--deep);
  color:var(--deep-t);flex:none}
.chat .c-top .av{width:36px;height:36px;border-radius:99px;overflow:hidden;flex:none;background:var(--bg2)}
.chat .c-top .av img{width:100%;height:100%;object-fit:cover}
.chat .c-top b{font-family:'Syne',sans-serif;font-size:.94rem;display:block;line-height:1.2}
.chat .c-top small{font-size:.71rem;opacity:.72}
.chat .c-top .x{margin-left:auto;color:inherit;opacity:.7}
.chat .c-corpo{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:11px;
  background:var(--bg2)}
.msg{max-width:86%;padding:11px 14px;border-radius:16px;font-size:.89rem;line-height:1.5;
  animation:su .3s ease both}
@keyframes su{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg.a{background:var(--card);border:1px solid var(--bord);border-bottom-left-radius:5px;align-self:flex-start}
.msg.u{background:var(--deep);color:var(--deep-t);border-bottom-right-radius:5px;align-self:flex-end}
.msg b{font-family:'Syne',sans-serif}
.msg .fatto{display:flex;align-items:center;gap:7px;margin-top:9px;padding-top:9px;
  border-top:1px dashed var(--bord);font-size:.78rem;color:var(--acc-s);font-family:'Syne',sans-serif;
  font-weight:600}
.msg .fatto svg{width:14px;height:14px}
.scrive{display:flex;gap:4px;padding:13px 15px;align-self:flex-start;background:var(--card);
  border:1px solid var(--bord);border-radius:16px;border-bottom-left-radius:5px}
.scrive i{width:6px;height:6px;border-radius:99px;background:var(--tx3);animation:salta 1.1s infinite}
.scrive i:nth-child(2){animation-delay:.15s}
.scrive i:nth-child(3){animation-delay:.3s}
@keyframes salta{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
.chat .c-sug{display:flex;gap:7px;padding:10px 14px 0;flex-wrap:wrap;background:var(--bg2)}
.chat .c-sug button{padding:.42em .85em;border-radius:99px;border:1.5px solid var(--bord);
  background:var(--card);font-size:.77rem;transition:.2s}
.chat .c-sug button:hover{border-color:var(--acc);color:var(--acc-s)}
