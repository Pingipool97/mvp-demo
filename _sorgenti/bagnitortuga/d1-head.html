<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Gestionale · Bagni Tortuga</title>
<style>
@font-face{font-family:'Inter';src:url({{ASSET:inter.woff2}}) format('woff2');font-weight:400 800;font-display:swap}

:root{
  --acc:#EFB402; --acc-s:#CE9C02; --acc-t:#0B2431;
  --deep:#014364; --deep-s:#01304A; --deep-t:#FFFFFF;
  --bg:#F1EFE9; --card:#FFFFFF; --card2:#FAF7F0;
  --tx:#0B2431; --tx2:#3F5768; --tx3:#8493A0;
  --bord:#E2DED4; --om:rgba(1,67,100,.10);
  --ok:#2E8B57; --ko:#C0392B; --att:#C77D0A;
  --rail:66px; }

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--tx);
  font-size:15.5px;line-height:1.55;-webkit-text-size-adjust:100%}
h1,h2,h3,h4,.sy{font-family:'Inter',system-ui,sans-serif;font-weight:700;letter-spacing:-.015em;line-height:1.2}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
img{max-width:100%;display:block}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px}
::selection{background:var(--acc);color:var(--acc-t)}

/* ============ HAMBURGER E PANNELLO LATERALE ============ */
.marchio{display:flex;align-items:center;gap:10px;flex:none}
.marchio .logo{width:40px;height:40px;border-radius:99px;overflow:hidden;background:#fff;flex:none}
.burger{width:44px;height:44px;border-radius:12px;flex:none;display:grid;place-items:center;
  background:var(--deep);color:#fff;transition:.16s;position:relative}
.burger:hover{background:var(--deep-s)}
.burger svg{width:21px;height:21px}
.burger .pallo{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:99px;
  background:var(--acc);border:2px solid var(--card)}

.lato{position:fixed;left:0;top:0;bottom:0;width:min(272px,86vw);background:var(--deep);
  color:#fff;z-index:80;transform:translateX(-101%);transition:transform .3s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;padding:14px 12px}
.lato.on{transform:none}
.lato .l-top{display:flex;align-items:center;gap:11px;padding:6px 6px 16px;
  border-bottom:1px solid rgba(255,255,255,.15);margin-bottom:12px}
.lato .l-top .logo{width:40px;height:40px;border-radius:99px;overflow:hidden;background:#fff;flex:none}
.lato .l-top b{font-size:.95rem;display:block;line-height:1.2}
.lato .l-top small{font-size:.73rem;opacity:.66}
.lato .l-top .x{margin-left:auto;color:#fff;opacity:.7;padding:6px}
.lato .l-top .x:hover{opacity:1}
.lato nav{display:grid;gap:3px}
.lato nav button{display:flex;align-items:center;gap:12px;width:100%;padding:.72em .8em;
  border-radius:10px;text-align:left;font-size:.92rem;color:rgba(255,255,255,.74);transition:.14s}
.lato nav button:hover{background:rgba(255,255,255,.1);color:#fff}
.lato nav button.on{background:var(--acc);color:var(--acc-t);font-weight:600}
.lato nav button svg{width:19px;height:19px;flex:none}
.lato nav button .pallo{margin-left:auto;width:8px;height:8px;border-radius:99px;background:var(--acc);flex:none}
.lato nav button.on .pallo{background:var(--deep)}
.lato .div{height:1px;background:rgba(255,255,255,.15);margin:9px 8px}
.lato .l-piede{margin-top:auto;padding:12px 8px 4px;border-top:1px solid rgba(255,255,255,.15);
  font-size:.74rem;opacity:.6;line-height:1.5}

.corpo{min-height:100vh;display:flex;flex-direction:column}
.barra{display:flex;align-items:center;gap:14px;padding:14px 24px;background:var(--card);
  border-bottom:1px solid var(--bord);position:sticky;top:0;z-index:50;flex-wrap:wrap}
.barra h1{font-size:1.28rem}
.barra .oggi{font-size:.82rem;color:var(--tx3)}
.barra .dx{margin-left:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.cerca{display:flex;align-items:center;gap:8px;padding:.42em .8em;border-radius:99px;
  border:1.5px solid var(--bord);background:var(--card2);min-width:190px}
.cerca input{border:none;background:none;outline:none;width:100%;font-size:.88rem}
.cerca svg{width:16px;height:16px;color:var(--tx3);flex:none}
.utente{display:flex;align-items:center;gap:9px;padding-left:12px;border-left:1px solid var(--bord)}
.utente .cerchio{width:34px;height:34px;border-radius:99px;background:var(--deep);color:#fff;
  display:grid;place-items:center;font-family:'Inter',sans-serif;font-size:.82rem;font-weight:700}
.utente b{font-size:.86rem;display:block;line-height:1.2}
.utente small{font-size:.72rem;color:var(--tx3)}

.pagina{padding:22px 24px 40px;flex:1}
.pagina[hidden]{display:none}

/* ============ pezzi ============ */
.b{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:.6em 1.05em;
  border-radius:10px;font-family:'Inter',sans-serif;font-weight:700;font-size:.86rem;cursor:pointer;
  border:1.5px solid transparent;transition:.18s;white-space:nowrap}
.b svg{width:16px;height:16px}
.b-p{background:var(--acc);color:var(--acc-t)}
.b-p:hover{background:var(--acc-s)}
.b-d{background:var(--deep);color:#fff}
.b-d:hover{background:var(--deep-s)}
.b-s{border-color:var(--bord);background:var(--card)}
.b-s:hover{border-color:var(--acc);color:var(--acc-s)}
.b-ko{border-color:var(--bord);color:var(--ko);background:var(--card)}
.b-ko:hover{background:var(--ko);color:#fff;border-color:var(--ko)}
.b-sm{padding:.42em .8em;font-size:.79rem;border-radius:8px}
.b[disabled]{opacity:.45;pointer-events:none}

.scheda{background:var(--card);border:1px solid var(--bord);border-radius:16px;padding:20px}
.griglia{display:grid;gap:16px}
.griglia>*{min-width:0}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}

.kpi{background:var(--card);border:1px solid var(--bord);border-radius:16px;padding:17px 19px;
  position:relative;overflow:hidden}
.kpi .et{font-size:.76rem;color:var(--tx3);font-family:'Inter',sans-serif;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase}
.kpi b{display:block;font-family:'Inter',sans-serif;font-size:2rem;font-weight:800;margin:5px 0 2px;
  letter-spacing:-.03em}
.kpi small{font-size:.79rem;color:var(--tx2)}
.kpi .ic{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:11px;
  display:grid;place-items:center;background:var(--card2);color:var(--acc-s)}
.kpi.su small{color:var(--ok)}

.tit{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap}
.tit h2{font-size:1.05rem}
.tit .sx{display:flex;align-items:center;gap:10px}

table{width:100%;border-collapse:collapse;font-size:.87rem}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--bord);vertical-align:middle}
thead th{font-family:'Inter',sans-serif;font-size:.71rem;letter-spacing:.09em;text-transform:uppercase;
  color:var(--tx3);font-weight:700;white-space:nowrap}
tbody tr{cursor:pointer;transition:background .14s}
tbody tr:hover{background:var(--card2)}
td b{font-family:'Inter',sans-serif}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

.eti{display:inline-flex;align-items:center;gap:5px;padding:.24em .6em;border-radius:99px;
  font-size:.73rem;font-family:'Inter',sans-serif;font-weight:600;white-space:nowrap}
.eti-ok{background:rgba(46,139,87,.13);color:var(--ok)}
.eti-att{background:rgba(199,125,10,.14);color:var(--att)}
.eti-ko{background:rgba(192,57,43,.12);color:var(--ko)}
.eti-neu{background:var(--card2);color:var(--tx2);border:1px solid var(--bord)}
.eti-bim{background:rgba(239,180,2,.18);color:#8A6A00}

/* mappa */
.tab-scorri{overflow-x:auto;min-width:0}
.mappa-scorri{overflow-x:auto;min-width:0;border-radius:12px;background:var(--card2);border:1px solid var(--bord)}
.mappa-scorri svg{width:100%;min-width:0;height:auto;stroke:none;display:block;transition:min-width .25s}
.mappa-scorri.z1 svg{min-width:820px}
.mappa-scorri.z2 svg{min-width:1180px}
.zoom{display:inline-flex;gap:2px;align-items:center;border:1.5px solid var(--bord);border-radius:99px;padding:2px}
.zoom button{width:30px;height:30px;border-radius:99px;display:grid;place-items:center;transition:.15s;font-weight:700}
.zoom button:hover{background:var(--bg2,#f3f3f3)}
.zoom button[disabled]{opacity:.3;pointer-events:none}
.zoom span{font-size:.76rem;color:var(--tx3);padding:0 6px;min-width:44px;text-align:center}
#mappa .omb{cursor:pointer}
#mappa .omb:focus{outline:none}
#mappa .omb:focus-visible .disco{transform:scale(1.15)}
#mappa .omb .disco{transition:transform .16s}
#mappa .omb:hover .disco{transform:scale(1.15)}
#mappa .et{font-family:'Inter',sans-serif;font-size:8px;font-weight:700;fill:var(--tx3);
  text-anchor:middle;pointer-events:none;user-select:none}
.legenda{display:flex;gap:13px;flex-wrap:wrap;font-size:.77rem;color:var(--tx2);min-width:0}
.legenda span{display:flex;align-items:center;gap:6px}
.legenda i{width:12px;height:12px;border-radius:4px;display:block;flex:none}

/* cassetto laterale */
.cass{position:fixed;right:0;top:0;bottom:0;width:min(400px,94vw);background:var(--card);
  border-left:1px solid var(--bord);box-shadow:-18px 0 50px -20px var(--om);z-index:70;
  transform:translateX(101%);transition:transform .32s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column}
.cass.on{transform:none}
.cass .c-top{padding:18px 20px;border-bottom:1px solid var(--bord);display:flex;
  align-items:flex-start;gap:12px}
.cass .c-top h3{font-size:1.1rem}
.cass .c-top small{color:var(--tx3);font-size:.79rem}
.cass .c-corpo{flex:1;overflow-y:auto;padding:18px 20px}
.cass .c-piede{padding:14px 20px;border-top:1px solid var(--bord);display:flex;gap:8px;flex-wrap:wrap}
.velo{position:fixed;inset:0;background:rgba(6,20,30,.35);z-index:65;opacity:0;pointer-events:none;
  transition:.28s}
.velo.on{opacity:1;pointer-events:auto}

.dato{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--bord);
  font-size:.88rem}
.dato:last-child{border:none}
.dato span:first-child{color:var(--tx3)}
.dato span:last-child{text-align:right;font-family:'Inter',sans-serif;font-weight:600}

.campo{margin-bottom:13px}
.campo label{display:block;font-size:.76rem;font-family:'Inter',sans-serif;font-weight:600;
  color:var(--tx2);margin-bottom:5px}
.campo input,.campo select,.campo textarea{width:100%;padding:.6em .8em;border-radius:9px;
  border:1.5px solid var(--bord);background:var(--card2);font-size:.9rem}
.campo input:focus,.campo select:focus{outline:none;border-color:var(--acc);background:var(--card)}

.filtri{display:flex;gap:7px;flex-wrap:wrap}
.filtri button{padding:.38em .85em;border-radius:99px;border:1.5px solid var(--bord);font-size:.81rem;
  font-family:'Inter',sans-serif;font-weight:600;background:var(--card);transition:.16s}
.filtri button:hover{border-color:var(--acc)}
.filtri button.on{background:var(--deep);color:#fff;border-color:var(--deep)}

.vuoto{padding:34px;text-align:center;color:var(--tx3);font-size:.88rem}
.nota{font-size:.8rem;color:var(--tx3);padding:13px 15px;border-radius:11px;background:var(--card2);
  border:1px dashed var(--bord);line-height:1.55}

/* ============ ASSISTENTE ============ */
.assist{background:var(--deep);color:#fff;border-radius:16px;padding:20px}
.assist .a-top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.assist .a-top svg{width:20px;height:20px;color:var(--acc)}
.assist .a-top h2{font-size:1.05rem}
.assist .a-top span{margin-left:auto;font-size:.76rem;opacity:.6}
.assist .cons{background:rgba(255,255,255,.07);border-radius:12px;padding:15px 16px;margin-bottom:10px}
.assist .cons:last-child{margin-bottom:0}
.assist .cons .riga1{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}
.assist .cons h4{font-size:.95rem;font-weight:700;line-height:1.3}
.assist .cons p{font-size:.85rem;opacity:.78;margin-top:5px;line-height:1.45}
.assist .cons .az{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.assist .cons .az button{padding:.4em .85em;border-radius:8px;font-size:.8rem;font-weight:600;
  background:rgba(255,255,255,.14);color:#fff;transition:.15s}
.assist .cons .az button:hover{background:rgba(255,255,255,.26)}
.assist .cons .az button.forte{background:var(--acc);color:var(--acc-t)}
.assist .cons .az button.forte:hover{background:var(--acc-s)}
.tag{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:.24em .55em;border-radius:6px;flex:none}
.tag-urg{background:#C0392B;color:#fff}
.tag-oggi{background:var(--acc);color:var(--acc-t)}
.tag-info{background:rgba(255,255,255,.16);color:#fff}

/* ============ WHATSAPP ============ */
.wa{display:grid;grid-template-columns:320px 1fr;gap:0;border:1px solid var(--bord);
  border-radius:16px;overflow:hidden;background:var(--card);height:min(620px,72vh)}
.wa-elenco{border-right:1px solid var(--bord);overflow-y:auto;background:var(--card2)}
.wa-c{display:flex;gap:11px;padding:13px 14px;border-bottom:1px solid var(--bord);cursor:pointer;
  transition:.14s}
.wa-c:hover{background:var(--card)}
.wa-c.on{background:var(--card);border-left:3px solid var(--acc);padding-left:11px}
.wa-c .cerchio{width:38px;height:38px;border-radius:99px;background:var(--deep);color:#fff;
  display:grid;place-items:center;font-size:.8rem;font-weight:700;flex:none}
.wa-c .testo{min-width:0;flex:1}
.wa-c b{font-size:.88rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wa-c small{font-size:.78rem;color:var(--tx3);display:block;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.wa-c .dx2{text-align:right;flex:none}
.wa-c .dx2 .ora{font-size:.7rem;color:var(--tx3)}
.wa-c .dx2 .n{display:inline-grid;place-items:center;min-width:19px;height:19px;border-radius:99px;
  background:#25D366;color:#fff;font-size:.7rem;font-weight:700;margin-top:4px;padding:0 5px}
.wa-t{display:flex;flex-direction:column;min-width:0}
.wa-t .t-top{display:flex;align-items:center;gap:11px;padding:13px 16px;border-bottom:1px solid var(--bord);
  flex-wrap:wrap}
.wa-t .t-top .cerchio{width:36px;height:36px;border-radius:99px;background:var(--deep);color:#fff;
  display:grid;place-items:center;font-size:.78rem;font-weight:700;flex:none}
.wa-t .t-top b{font-size:.93rem;display:block;line-height:1.2}
.wa-t .t-top small{font-size:.75rem;color:var(--tx3)}
.wa-t .t-top .az{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}
.wa-msg{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:9px;
  background:var(--card2)}
.wa-b{max-width:76%;padding:9px 13px;border-radius:14px;font-size:.87rem;line-height:1.45}
.wa-b.cli{background:var(--card);border:1px solid var(--bord);align-self:flex-start;
  border-bottom-left-radius:4px}
.wa-b.noi{background:#DCF8C6;color:#0B2431;align-self:flex-end;border-bottom-right-radius:4px}
.wa-b.sistema{align-self:center;background:transparent;color:var(--tx3);font-size:.76rem;
  border:1px dashed var(--bord);border-radius:99px;padding:5px 12px}
.wa-b .chi{display:block;font-size:.7rem;opacity:.6;margin-bottom:2px;font-weight:700}
.wa-piede{padding:11px 14px;border-top:1px solid var(--bord);display:flex;gap:8px;background:var(--card)}
.wa-piede input{flex:1;padding:.6em .9em;border-radius:99px;border:1.5px solid var(--bord);
  background:var(--card2);font-size:.88rem}
.wa-piede input:focus{outline:none;border-color:var(--acc)}
.wa-piede button{width:40px;height:40px;border-radius:99px;background:#25D366;color:#fff;
  display:grid;place-items:center;flex:none}
.wa-rapide{display:flex;gap:6px;padding:9px 14px 0;flex-wrap:wrap;background:var(--card)}
.wa-rapide button{padding:.36em .8em;border-radius:99px;border:1.5px solid var(--bord);font-size:.78rem;
  background:var(--card2);transition:.14s}
.wa-rapide button:hover{border-color:var(--acc)}
@media(max-width:880px){
  .wa{grid-template-columns:1fr;height:auto}
  .wa-elenco{max-height:260px;border-right:none;border-bottom:1px solid var(--bord)}
  .wa-msg{height:340px}
}

/* barre di incasso */
.barre{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:10px}
.barre div{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;
  justify-content:flex-end}
.barre i{width:100%;background:var(--deep);border-radius:6px 6px 0 0;display:block;min-height:3px;
  transition:height .5s}
.barre div:last-child i{background:var(--acc)}
.barre small{font-size:.7rem;color:var(--tx3)}

/* avviso */
.toast{position:fixed;left:50%;transform:translate(-50%,16px);bottom:22px;z-index:90;
  background:var(--tx);color:#fff;padding:13px 18px;border-radius:12px;font-size:.87rem;
  box-shadow:0 18px 40px -14px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.28s;
  max-width:min(460px,92vw);display:flex;gap:10px;align-items:flex-start}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast svg{width:17px;height:17px;color:var(--acc);flex:none;margin-top:2px}

@media(max-width:1080px){
  .g4{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:1fr}
  .pagina .griglia[style]{grid-template-columns:1fr!important}
}
@media(max-width:780px){
  .marchio .nome{display:none}
  .tendina{min-width:min(300px,calc(100vw - 28px))}
  .g2{grid-template-columns:1fr}
  .pagina{padding:16px 14px 30px}
  .barra{padding:11px 14px}
  .cerca{min-width:0;flex:1}
  .utente b,.utente small{display:none}
  .tab-scorri{overflow-x:auto}
  .tab-scorri table{min-width:620px}
}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>
