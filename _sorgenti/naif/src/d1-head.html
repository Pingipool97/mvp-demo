<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Gestionale · Naïf Hair&amp;Beauty</title>
<style>
@font-face{font-family:'Bodoni';src:url({{ASSET:bodoni.woff2}}) format('woff2');font-weight:400 700;font-display:swap}
@font-face{font-family:'Archivo';src:url({{ASSET:archivo.woff2}}) format('woff2');font-weight:300 600;font-display:swap}

:root{
  --inch:#171310; --inch-2:#241D18; --inch-3:#332A22;
  --ottone:#A97C4A; --ottone-s:#8A6136; --ottone-c:#E9D9C3;
  --bg:#EFEBE4; --carta:#FFFFFF; --carta2:#F8F5EF;
  --tx:#171310; --tx2:#59504A; --tx3:#948A7F;
  --filo:#DFD6C8; --om:rgba(23,19,16,.14);
  --ok:#4E7A3C; --ko:#B4503F; --att:#B5822B;
  --spalla:330px;
}
*{box-sizing:border-box;margin:0;padding:0}
/* display:grid o flex battono l'attributo hidden: qui non succede */
[hidden]{display:none!important}
body{font-family:'Archivo',system-ui,sans-serif;background:var(--bg);color:var(--tx);
  font-size:15px;font-weight:300;line-height:1.55;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:'Bodoni',Didot,Georgia,serif;font-weight:400;line-height:1.12}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--ottone);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.et{font-size:.63rem;letter-spacing:.24em;text-transform:uppercase;color:var(--tx3)}

/* =========================================================
   IMPIANTO: testata con schede in alto, spalla fissa a destra
   niente cassetto laterale, niente riquadri sparsi
   ========================================================= */
.testata{position:sticky;top:0;z-index:60;background:var(--inch);color:#fff}
.testata .alto{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px clamp(12px,2vw,22px)}
.testata .marchio{display:flex;align-items:center;gap:11px;flex:none}
.testata .marchio img{height:21px;width:auto;filter:invert(1) brightness(2.4)}
.testata .marchio span{font-size:.63rem;letter-spacing:.22em;text-transform:uppercase;
  color:rgba(255,255,255,.45);border-left:1px solid rgba(255,255,255,.2);padding-left:11px}
.testata .cerca{margin-left:auto;display:flex;align-items:center;gap:8px;padding:.32em .8em;
  border:1px solid rgba(255,255,255,.22);border-radius:99px;min-width:0;flex:1 1 160px;
  max-width:280px}
.testata .cerca input{border:none;background:none;outline:none;width:100%;font-size:.84rem;
  color:#fff}
.testata .cerca input::placeholder{color:rgba(255,255,255,.4)}
.testata .cerca svg{width:15px;height:15px;color:rgba(255,255,255,.45)}
.testata .oggi{font-size:.76rem;color:rgba(255,255,255,.55);white-space:nowrap}
.schede{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;
  border-top:1px solid rgba(255,255,255,.12)}
.schede::-webkit-scrollbar{display:none}
.schede button{display:flex;align-items:center;gap:8px;padding:.85em 1.1em;font-size:.83rem;
  color:rgba(255,255,255,.6);white-space:nowrap;border-bottom:2px solid transparent;transition:.16s}
.schede button:hover{color:#fff;background:rgba(255,255,255,.05)}
.schede button.on{color:#fff;border-bottom-color:var(--ottone)}
.schede button svg{width:16px;height:16px;opacity:.8}
.schede button .n{background:var(--ko);color:#fff;font-size:.65rem;min-width:18px;height:18px;
  border-radius:99px;display:grid;place-items:center;padding:0 5px}
.schede .div{width:1px;background:rgba(255,255,255,.12);margin:.6em .5em;flex:none}

.scena{display:grid;grid-template-columns:1fr var(--spalla);align-items:start}
.opera{padding:clamp(14px,2vw,22px);min-width:0}
.spalla{position:sticky;top:104px;height:calc(100vh - 104px);overflow-y:auto;
  border-left:1px solid var(--filo);background:var(--carta);padding:16px 15px 26px}
body.spalla-giu .scena{grid-template-columns:1fr}
body.spalla-giu .spalla{display:none}

/* blocchi senza riquadri: solo filetti */
.blocco{background:var(--carta);border:1px solid var(--filo);margin-bottom:14px}
.blocco>.cap{display:flex;align-items:center;gap:11px;justify-content:space-between;
  padding:12px 15px;border-bottom:1px solid var(--filo);flex-wrap:wrap}
.blocco>.cap h2{font-size:1.16rem}
.blocco>.cap .sx{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.blocco>.in{padding:15px}
.blocco>.in.stretto{padding:0}

.b{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:.5em 1em;
  font-size:.82rem;cursor:pointer;border:1px solid transparent;transition:.16s;white-space:nowrap}
.b svg{width:15px;height:15px}
.b-p{background:var(--ottone);color:#fff}
.b-p:hover{background:var(--ottone-s)}
.b-n{background:var(--inch);color:#fff}
.b-n:hover{background:var(--inch-2)}
.b-s{border-color:var(--filo);background:var(--carta)}
.b-s:hover{border-color:var(--inch)}
.b-ko{border-color:var(--filo);color:var(--ko);background:var(--carta)}
.b-ko:hover{background:var(--ko);color:#fff;border-color:var(--ko)}
.b-sm{padding:.34em .7em;font-size:.77rem}
.b[disabled]{opacity:.4;pointer-events:none}

/* numeri in fila, separati da filetti, senza schede */
.numeri{display:flex;flex-wrap:wrap;background:var(--carta);border:1px solid var(--filo);
  margin-bottom:14px}
.numeri>div{flex:1 1 190px;padding:13px 16px;border-right:1px solid var(--filo)}
.numeri>div:last-child{border-right:none}
.numeri b{display:block;font-family:'Bodoni',serif;font-size:1.85rem;margin:3px 0 1px}
.numeri small{font-size:.77rem;color:var(--tx2)}
.numeri .bar{height:3px;background:var(--filo);margin-top:8px;overflow:hidden}
.numeri .bar i{display:block;height:100%;background:var(--ottone)}

table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--filo)}
thead th{font-size:.63rem;letter-spacing:.14em;text-transform:uppercase;color:var(--tx3);
  white-space:nowrap;font-weight:400;background:var(--carta2)}
tbody tr{cursor:pointer;transition:.14s}
tbody tr:hover{background:var(--carta2)}
tbody tr td:first-child{box-shadow:inset 3px 0 0 transparent}
tbody tr:hover td:first-child{box-shadow:inset 3px 0 0 var(--ottone)}
td.dx,th.dx{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scorri{overflow-x:auto;min-width:0}
@media(max-width:820px){.scorri table{min-width:660px}}

.eti{display:inline-flex;align-items:center;gap:5px;padding:.14em .55em;font-size:.71rem;
  white-space:nowrap;border:1px solid transparent}
.eti-ok{background:rgba(78,122,60,.12);color:var(--ok)}
.eti-att{background:rgba(181,130,43,.14);color:var(--att)}
.eti-ko{background:rgba(180,80,63,.11);color:var(--ko)}
.eti-neu{background:var(--carta2);color:var(--tx2);border-color:var(--filo)}
.eti-web{background:rgba(169,124,74,.13);color:var(--ottone-s)}

.filtri{display:flex;gap:0;flex-wrap:wrap;border:1px solid var(--filo);background:var(--carta)}
.filtri button{padding:.34em .85em;font-size:.78rem;color:var(--tx2);
  border-right:1px solid var(--filo);transition:.14s}
.filtri button:last-child{border-right:none}
.filtri button:hover{background:var(--carta2);color:var(--tx)}
.filtri button.on{background:var(--inch);color:#fff}

.campo{margin-bottom:11px}
.campo label{display:block;font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--tx3);margin-bottom:4px}
.campo input,.campo select,.campo textarea{width:100%;padding:.55em .7em;border:1px solid var(--filo);
  background:var(--carta2);font-size:.87rem}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:none;border-color:var(--ottone);
  background:var(--carta)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.vuoto{padding:26px;text-align:center;color:var(--tx3);font-size:.86rem}
.nota{font-size:.78rem;color:var(--tx3);padding:10px 12px;background:var(--carta2);
  border-left:2px solid var(--filo);line-height:1.5}

/* ---------- AGENDA ---------- */
.leg{display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:.75rem;color:var(--tx2)}
.leg span{display:flex;align-items:center;gap:6px}
.leg i{width:8px;height:8px;display:block;flex:none}
.ag-guscio{overflow:auto;max-height:calc(100vh - 210px);border:1px solid var(--filo);
  background:var(--carta)}
.ag{display:grid;position:relative}
.ag .ang,.ag .dt{position:sticky;top:0;z-index:6;background:var(--carta);
  border-bottom:1px solid var(--filo);border-right:1px solid var(--filo)}
.ag .dt{text-align:left;padding:8px 10px}
.ag .dt span{display:block;font-size:.63rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--tx3)}
.ag .dt b{font-family:'Bodoni',serif;font-size:1.14rem;font-weight:400;display:block;
  line-height:1.2}
.ag .dt small{font-size:.63rem;color:var(--ko);display:block;line-height:1.2}
.ag .dt.oggi{background:var(--inch);color:#fff}
.ag .dt.oggi span{color:rgba(255,255,255,.5)}
.ag .dt.no{background:var(--carta2)}
.ag .dt.no b{color:var(--tx3)}
.ag .oh{height:50px;font-size:.69rem;color:var(--tx3);padding:3px 8px 0 0;text-align:right;
  border-bottom:1px solid var(--filo);border-right:1px solid var(--filo);background:var(--carta2);
  font-variant-numeric:tabular-nums;position:sticky;left:0;z-index:5}
.ag .oh.mezza{opacity:.45;font-size:.64rem}
.ag .ang{left:0;z-index:7}
.ag .cs{height:50px;border-bottom:1px solid var(--filo);border-right:1px solid var(--filo);
  display:flex;gap:2px;padding:2px;cursor:pointer;transition:.12s}
.ag .cs:hover{background:rgba(169,124,74,.09)}
.ag .cs.no{cursor:not-allowed;background:repeating-linear-gradient(45deg,var(--carta2),
  var(--carta2) 6px,#E9E2D7 6px,#E9E2D7 12px)}
.ag .cs.no:hover{background:repeating-linear-gradient(45deg,var(--carta2),
  var(--carta2) 6px,#E9E2D7 6px,#E9E2D7 12px)}
.bloc{flex:1;min-width:0;padding:4px 7px;font-size:.71rem;line-height:1.25;overflow:hidden;
  cursor:pointer;border-left:3px solid var(--tx3);background:var(--carta2);color:var(--tx);
  transition:.12s}
.bloc:hover{filter:brightness(.97)}
.bloc u{display:block;text-decoration:none;font-variant-numeric:tabular-nums;font-size:.67rem;
  opacity:.7}
.bloc b{display:block;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bloc small{display:block;color:var(--tx3);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;font-size:.66rem}
.bloc.fatto{opacity:.58}
.bloc.annullata{opacity:.5;text-decoration:line-through}
.bloc.altri{flex:0 0 30px;display:grid;place-items:center;font-size:.76rem;padding:0;
  border-left-color:var(--tx3);color:var(--tx2)}
/* riga dell'ora corrente */
.ora-ora{position:absolute;left:0;right:0;height:1px;background:var(--ko);z-index:4;
  pointer-events:none}
.ora-ora::before{content:"";position:absolute;left:0;top:-3px;width:7px;height:7px;
  border-radius:99px;background:var(--ko)}

/* ---------- spalla ---------- */
.sp-grp{margin-bottom:20px}
.sp-grp>h3{font-size:.63rem;letter-spacing:.24em;text-transform:uppercase;color:var(--tx3);
  padding-bottom:7px;border-bottom:1px solid var(--filo);margin-bottom:10px}
.sp-num{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;
  font-size:.85rem}
.sp-num b{font-family:'Bodoni',serif;font-size:1.16rem;font-weight:400}
.cons{border-left:2px solid var(--ottone);padding:9px 0 9px 11px;margin-bottom:12px}
.cons h4{font-family:'Archivo',sans-serif;font-weight:400;font-size:.88rem;line-height:1.35}
.cons p{font-size:.79rem;color:var(--tx3);margin-top:3px;line-height:1.45}
.cons .az{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.cons .az button{padding:.26em .7em;font-size:.76rem;border:1px solid var(--filo);
  background:var(--carta2);transition:.14s}
.cons .az button:hover{border-color:var(--inch)}
.cons .az button.p{background:var(--inch);color:#fff;border-color:var(--inch)}
.pross{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--filo);font-size:.82rem;
  cursor:pointer}
.pross:hover{background:var(--carta2)}
.pross .o{font-variant-numeric:tabular-nums;color:var(--ottone-s);flex:none;width:42px}
.pross b{font-weight:400;display:block}
.pross small{color:var(--tx3);font-size:.75rem}
.sp-chiudi{width:100%;margin-top:6px;font-size:.75rem;color:var(--tx3);padding:6px}
.sp-chiudi:hover{color:var(--tx)}
.sp-apri{position:fixed;right:14px;bottom:14px;z-index:58;background:var(--inch);color:#fff;
  padding:.6em 1em;font-size:.76rem;display:none;align-items:center;gap:8px;
  box-shadow:0 14px 28px -14px var(--om)}
body.spalla-giu .sp-apri{display:inline-flex}

/* ---------- whatsapp ---------- */
.wa{display:grid;grid-template-columns:280px 1fr;border:1px solid var(--filo);background:var(--carta);
  height:min(70vh,600px)}
.wa-el{border-right:1px solid var(--filo);overflow-y:auto}
.wa-el .v{padding:11px 13px;border-bottom:1px solid var(--filo);cursor:pointer;transition:.14s}
.wa-el .v:hover{background:var(--carta2)}
.wa-el .v.on{background:var(--carta2);box-shadow:inset 3px 0 0 var(--ottone)}
.wa-el .v .r{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.wa-el .v b{font-weight:400;font-size:.89rem}
.wa-el .v small{font-size:.7rem;color:var(--tx3)}
.wa-el .v p{font-size:.78rem;color:var(--tx3);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;margin-top:2px}
.wa-t{display:flex;flex-direction:column;min-width:0}
.wa-top{padding:10px 14px;border-bottom:1px solid var(--filo);display:flex;gap:10px;
  align-items:center;flex-wrap:wrap}
.wa-msg{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;
  background:var(--carta2)}
.wa-b{max-width:76%;padding:8px 12px;font-size:.85rem;background:var(--carta);
  border:1px solid var(--filo)}
.wa-b.noi{background:var(--inch);color:#fff;border-color:var(--inch);align-self:flex-end}
.wa-b.sis{align-self:center;background:transparent;border:1px dashed var(--filo);color:var(--tx3);
  font-size:.74rem;padding:3px 10px}
.wa-b .chi{display:block;font-size:.66rem;opacity:.6;margin-bottom:2px}
.wa-p{display:flex;gap:7px;padding:10px 13px;border-top:1px solid var(--filo)}
.wa-p input{flex:1;padding:.5em .8em;border:1px solid var(--filo);background:var(--carta2);
  font-size:.85rem}
.wa-p input:focus{outline:none;border-color:var(--ottone)}
.wa-p button{width:36px;height:36px;background:var(--inch);color:#fff;display:grid;
  place-items:center;flex:none}
.wa-rap{display:flex;gap:6px;padding:9px 13px 0;flex-wrap:wrap}
.wa-rap button{padding:.26em .7em;border:1px solid var(--filo);font-size:.75rem;
  background:var(--carta2)}

/* ---------- incassi ---------- */
.barre{display:flex;align-items:flex-end;gap:8px;height:180px;margin:14px 0 4px}
.barre .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;
  gap:5px;height:100%}
.barre .col i{width:100%;background:var(--inch);display:block;transition:height .5s}
.barre .col.pros i{background:repeating-linear-gradient(45deg,var(--ottone),var(--ottone) 5px,
  var(--ottone-s) 5px,var(--ottone-s) 10px)}
.barre .col span{font-size:.67rem;color:var(--tx3)}
.barre .col b{font-size:.71rem;font-weight:400;color:var(--tx2)}
.quota{display:flex;height:24px;overflow:hidden;margin-bottom:12px;border:1px solid var(--filo)}
.quota div{display:grid;place-items:center;font-size:.72rem;color:#fff;transition:width .5s}
.riga-p{display:flex;justify-content:space-between;gap:12px;padding:8px 0;
  border-bottom:1px solid var(--filo);font-size:.86rem}
.riga-p:last-child{border:none}
.riga-p b{font-weight:400;font-variant-numeric:tabular-nums}
.scorta{height:4px;background:var(--filo);overflow:hidden;min-width:70px}
.scorta i{display:block;height:100%;background:var(--ok)}
.scorta.basso i{background:var(--ko)}

/* ---------- foglio di lavoro (al posto del cassetto) ---------- */
.foglio{position:fixed;inset:0;z-index:90;background:rgba(23,19,16,.5);display:none;
  place-items:center;padding:clamp(10px,3vw,34px)}
.foglio.on{display:grid}
.foglio .carta{background:var(--carta);width:min(720px,100%);max-height:92vh;overflow-y:auto;
  border:1px solid var(--filo);box-shadow:0 30px 70px -30px rgba(0,0,0,.5)}
.foglio .cap{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;
  padding:16px 18px;border-bottom:1px solid var(--filo);position:sticky;top:0;background:var(--carta)}
.foglio .cap h2{font-size:1.34rem}
.foglio .cap p{font-size:.8rem;color:var(--tx3);margin-top:2px}
.foglio .corpo{padding:18px}
.foglio .piede{display:flex;gap:8px;flex-wrap:wrap;padding:14px 18px;border-top:1px solid var(--filo);
  position:sticky;bottom:0;background:var(--carta)}
.dett{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--filo);
  border:1px solid var(--filo);margin-bottom:14px}
.dett div{background:var(--carta);padding:9px 12px;font-size:.85rem}
.dett div span{display:block;font-size:.63rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--tx3);margin-bottom:2px}

.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,14px);z-index:95;
  background:var(--inch);color:#fff;padding:13px 18px;font-size:.86rem;max-width:min(460px,92vw);
  box-shadow:0 20px 40px -18px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.3s;
  border-left:2px solid var(--ottone)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}

@media(max-width:1180px){
  .scena{grid-template-columns:1fr}
  .spalla{position:static;height:auto;border-left:none;border-top:1px solid var(--filo)}
  .sp-apri{display:none!important}
}
@media(max-width:820px){
  .dett{grid-template-columns:1fr}
  .wa{grid-template-columns:1fr;height:auto}
  .wa-el{max-height:210px;border-right:none;border-bottom:1px solid var(--filo)}
  .wa-msg{height:300px}
  .testata .cerca{min-width:120px}
  .testata .oggi{display:none}
  .duo,.trio{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>
