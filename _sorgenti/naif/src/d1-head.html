<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Gestionale · Naïf Hair&amp;Beauty</title>
<style>
@font-face{font-family:'Playfair';src:url({{ASSET:playfair.woff2}}) format('woff2');font-weight:400 700;font-display:swap}
@font-face{font-family:'Jost';src:url({{ASSET:jost.woff2}}) format('woff2');font-weight:300 600;font-display:swap}

:root{
  --inch:#1A1614; --inch-2:#252019; --inch-3:#332B24;
  --ottone:#A97C4A; --ottone-s:#8C6438; --ottone-c:#F0E4D4;
  --bg:#F4F1EC; --carta:#FFFFFF; --carta2:#FAF7F2;
  --tx:#1A1614; --tx2:#5C534C; --tx3:#93887E;
  --bord:#E4DCD0; --om:rgba(26,22,20,.13);
  --ok:#4E7A3C; --ko:#B4503F; --att:#B5822B;
  --lato:264px;
}
*{box-sizing:border-box;margin:0;padding:0}
/* display:grid o flex battono l'attributo hidden: qui non succede */
[hidden]{display:none!important}
body{font-family:'Jost',system-ui,sans-serif;background:var(--bg);color:var(--tx);
  font-size:15px;font-weight:300;line-height:1.55;-webkit-text-size-adjust:100%}
h1,h2,h3,h4,.pf{font-family:'Playfair',Georgia,serif;font-weight:500;line-height:1.12;
  letter-spacing:-.005em}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--ottone);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ---------- pannello laterale ---------- */
.lato{position:fixed;left:0;top:0;bottom:0;width:min(var(--lato),88vw);background:var(--inch);
  color:#fff;display:flex;flex-direction:column;padding:16px 12px;z-index:82;overflow-y:auto;
  transform:translateX(-101%);transition:transform .3s cubic-bezier(.4,0,.2,1)}
.lato.on{transform:none}
.lato .cap{display:flex;align-items:center;gap:11px;padding:4px 6px 15px;
  border-bottom:1px solid rgba(255,255,255,.13);margin-bottom:12px}
.lato .cap img{height:22px;width:auto;filter:invert(1) brightness(2)}
.lato .cap .x{margin-left:auto;color:#fff;opacity:.6;padding:4px}
.lato .cap .x:hover{opacity:1}
.lato nav{display:grid;gap:2px}
.lato nav .grp{font-size:.63rem;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(255,255,255,.3);padding:15px 8px 6px}
.lato nav button{display:flex;align-items:center;gap:11px;width:100%;padding:.6em .7em;
  border-radius:3px;text-align:left;font-size:.9rem;color:rgba(255,255,255,.72);transition:.14s}
.lato nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.lato nav button.on{background:var(--ottone);color:#fff}
.lato nav button svg{width:18px;height:18px;flex:none}
.lato nav button .n{margin-left:auto;background:var(--ko);color:#fff;font-size:.67rem;
  min-width:19px;height:19px;border-radius:99px;display:grid;place-items:center;padding:0 5px}
.lato nav button.on .n{background:var(--inch)}
.lato .chi{margin-top:auto;padding-top:12px;border-top:1px solid rgba(255,255,255,.13);
  display:flex;align-items:center;gap:10px}
.lato .chi .t{width:34px;height:34px;border-radius:99px;background:var(--ottone);color:#fff;
  display:grid;place-items:center;font-family:'Playfair',serif;font-size:.9rem;flex:none}
.lato .chi b{font-size:.85rem;display:block;font-weight:400;line-height:1.2}
.lato .chi small{font-size:.71rem;color:rgba(255,255,255,.45)}

.corpo{min-height:100vh;display:flex;flex-direction:column;
  transition:margin-left .3s cubic-bezier(.4,0,.2,1)}
@media(min-width:901px){ body.menu-aperto .corpo{margin-left:min(var(--lato),88vw)} }

.barra{display:flex;align-items:center;gap:13px;padding:12px 20px;background:var(--carta);
  border-bottom:1px solid var(--bord);position:sticky;top:0;z-index:50;flex-wrap:wrap}
.barra h1{font-size:1.34rem}
.barra .data{font-size:.79rem;color:var(--tx3)}
.barra .dx{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.burger{display:grid;width:40px;height:40px;border-radius:3px;background:var(--inch);color:#fff;
  place-items:center;flex:none}
.pagina{padding:19px 20px 40px;flex:1}

/* ---------- pezzi ---------- */
.b{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:.52em 1em;
  border-radius:3px;font-size:.83rem;font-weight:400;cursor:pointer;border:1px solid transparent;
  transition:.16s;white-space:nowrap}
.b svg{width:16px;height:16px}
.b-p{background:var(--ottone);color:#fff}
.b-p:hover{background:var(--ottone-s)}
.b-n{background:var(--inch);color:#fff}
.b-n:hover{background:var(--inch-2)}
.b-s{border-color:var(--bord);background:var(--carta)}
.b-s:hover{border-color:var(--inch)}
.b-ko{border-color:var(--bord);color:var(--ko);background:var(--carta)}
.b-ko:hover{background:var(--ko);color:#fff;border-color:var(--ko)}
.b-sm{padding:.36em .72em;font-size:.78rem}
.b[disabled]{opacity:.4;pointer-events:none}

.card{background:var(--carta);border:1px solid var(--bord);border-radius:6px;padding:17px}
.griglia{display:grid;gap:13px}
.griglia>*{min-width:0}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.kpi{background:var(--carta);border:1px solid var(--bord);border-radius:6px;padding:14px 16px}
.kpi .et{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--tx3)}
.kpi b{display:block;font-family:'Playfair',serif;font-size:1.9rem;font-weight:500;margin:5px 0 1px}
.kpi small{font-size:.78rem;color:var(--tx2)}
.kpi .bar{height:4px;border-radius:99px;background:var(--bord);margin-top:9px;overflow:hidden}
.kpi .bar i{display:block;height:100%;background:var(--ottone)}

.tit{display:flex;align-items:center;gap:11px;justify-content:space-between;margin-bottom:12px;
  flex-wrap:wrap}
.tit h2{font-size:1.14rem}
.tit .sx{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--bord)}
thead th{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);
  white-space:nowrap;font-weight:400}
tbody tr{cursor:pointer;transition:.14s}
tbody tr:hover{background:var(--carta2)}
td.dx,th.dx{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tab-scorri{overflow-x:auto;min-width:0}
@media(max-width:820px){.tab-scorri table{min-width:640px}}

.eti{display:inline-flex;align-items:center;gap:5px;padding:.16em .55em;border-radius:99px;
  font-size:.72rem;white-space:nowrap}
.eti-ok{background:rgba(78,122,60,.13);color:var(--ok)}
.eti-att{background:rgba(181,130,43,.15);color:var(--att)}
.eti-ko{background:rgba(180,80,63,.12);color:var(--ko)}
.eti-neu{background:var(--carta2);color:var(--tx2);border:1px solid var(--bord)}
.eti-web{background:rgba(169,124,74,.14);color:var(--ottone-s)}

.filtri{display:flex;gap:6px;flex-wrap:wrap}
.filtri button{padding:.3em .8em;border-radius:99px;border:1px solid var(--bord);font-size:.78rem;
  background:var(--carta);transition:.14s;color:var(--tx2)}
.filtri button:hover{border-color:var(--inch);color:var(--tx)}
.filtri button.on{background:var(--inch);color:#fff;border-color:var(--inch)}

.campo{margin-bottom:11px}
.campo label{display:block;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--tx3);margin-bottom:4px}
.campo input,.campo select,.campo textarea{width:100%;padding:.55em .72em;border-radius:3px;
  border:1px solid var(--bord);background:var(--carta2);font-size:.88rem}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:none;border-color:var(--ottone);
  background:var(--carta)}
.vuoto{padding:28px;text-align:center;color:var(--tx3);font-size:.87rem}
.nota{font-size:.79rem;color:var(--tx3);padding:11px 13px;border-radius:5px;background:var(--carta2);
  border:1px dashed var(--bord);line-height:1.5}

/* ---------- AGENDA ---------- */
.leg{display:flex;flex-wrap:wrap;gap:13px;align-items:center;margin-bottom:10px;font-size:.76rem;
  color:var(--tx2)}
.leg span{display:flex;align-items:center;gap:6px}
.leg i{width:9px;height:9px;border-radius:99px;display:block;flex:none}
.ag-guscio{overflow-x:auto;border:1px solid var(--bord);border-radius:6px;background:var(--carta)}
.ag{display:grid}
.ag .ang,.ag .dt{position:sticky;top:0;z-index:6;background:var(--carta);
  border-bottom:1px solid var(--bord);border-right:1px solid var(--bord)}
.ag .dt{text-align:center;padding:8px 6px}
.ag .dt span{display:block;font-size:.66rem;letter-spacing:.11em;text-transform:uppercase;
  color:var(--tx3)}
.ag .dt b{font-family:'Playfair',serif;font-size:1.2rem;font-weight:500;display:block;line-height:1.2}
.ag .dt small{font-size:.63rem;color:var(--ko);display:block;line-height:1.2}
.ag .dt.oggi{background:rgba(169,124,74,.12)}
.ag .dt.no{background:var(--carta2)}
.ag .dt.no b{color:var(--tx3)}
.ag .oh{height:52px;font-size:.7rem;color:var(--tx3);text-align:right;padding:3px 7px 0 0;
  border-bottom:1px solid var(--bord);border-right:1px solid var(--bord);background:var(--carta2);
  font-variant-numeric:tabular-nums}
.ag .oh.mezza{opacity:.45;font-size:.65rem}
.ag .cs{height:52px;border-bottom:1px solid var(--bord);border-right:1px solid var(--bord);
  display:flex;gap:2px;padding:2px;cursor:pointer;transition:.12s}
.ag .cs:hover{background:rgba(169,124,74,.1)}
.ag .cs.no{cursor:not-allowed;background:repeating-linear-gradient(45deg,var(--carta2),
  var(--carta2) 6px,#EDE7DE 6px,#EDE7DE 12px)}
.ag .cs.no:hover{background:repeating-linear-gradient(45deg,var(--carta2),
  var(--carta2) 6px,#EDE7DE 6px,#EDE7DE 12px)}
.bloc{flex:1;min-width:0;border-radius:4px;padding:4px 6px;font-size:.71rem;line-height:1.25;
  overflow:hidden;cursor:pointer;border-left:3px solid var(--tx3);background:var(--carta2);
  color:var(--tx);transition:.12s}
.bloc:hover{filter:brightness(.97)}
.bloc u{display:block;text-decoration:none;font-variant-numeric:tabular-nums;font-size:.68rem;
  opacity:.75}
.bloc b{display:block;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bloc small{display:block;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-size:.67rem}
.bloc.altri{flex:0 0 32px;display:grid;place-items:center;font-size:.78rem;padding:0;
  background:var(--carta2);border-left-color:var(--tx3);color:var(--tx2)}
.bloc.fatto{opacity:.62}
.bloc.annullata{opacity:.5;text-decoration:line-through}

/* ---------- assistente ---------- */
.assist{background:var(--inch);color:#fff;border-radius:6px;padding:16px}
.assist .a-top{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.assist .a-top svg{width:18px;height:18px;color:var(--ottone-c)}
.assist .a-top h2{font-size:1.05rem}
.assist .a-top span{margin-left:auto;font-size:.73rem;opacity:.55}
.cons{background:rgba(255,255,255,.07);border-radius:5px;padding:12px 13px;margin-bottom:8px}
.cons:last-child{margin-bottom:0}
.cons .r1{display:flex;gap:9px;justify-content:space-between;align-items:flex-start}
.cons h4{font-family:'Jost',sans-serif;font-weight:400;font-size:.93rem;line-height:1.3}
.cons p{font-size:.82rem;color:rgba(255,255,255,.66);margin-top:4px}
.cons .az{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.cons .az button{padding:.32em .8em;border-radius:3px;font-size:.79rem;background:rgba(255,255,255,.13);
  color:#fff;transition:.14s}
.cons .az button:hover{background:rgba(255,255,255,.24)}
.cons .az button.p{background:var(--ottone)}
.cons .quando{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;opacity:.5;flex:none}

/* ---------- whatsapp ---------- */
.wa{display:grid;grid-template-columns:290px 1fr;border:1px solid var(--bord);border-radius:6px;
  overflow:hidden;background:var(--carta);height:min(72vh,640px)}
.wa-el{border-right:1px solid var(--bord);overflow-y:auto}
.wa-el .v{padding:12px 13px;border-bottom:1px solid var(--bord);cursor:pointer;transition:.14s}
.wa-el .v:hover{background:var(--carta2)}
.wa-el .v.on{background:rgba(169,124,74,.12)}
.wa-el .v .r{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.wa-el .v b{font-weight:400;font-size:.9rem}
.wa-el .v small{font-size:.7rem;color:var(--tx3)}
.wa-el .v p{font-size:.79rem;color:var(--tx3);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;margin-top:2px}
.wa-t{display:flex;flex-direction:column;min-width:0}
.wa-top{padding:11px 14px;border-bottom:1px solid var(--bord);display:flex;gap:10px;
  align-items:center;flex-wrap:wrap}
.wa-msg{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;
  background:#F3EFE8}
.wa-b{max-width:78%;padding:8px 12px;border-radius:9px;font-size:.86rem;background:var(--carta);
  box-shadow:0 1px 2px rgba(0,0,0,.06)}
.wa-b.noi{background:#DCE9CF;align-self:flex-end}
.wa-b.sis{align-self:center;background:transparent;border:1px dashed var(--bord);color:var(--tx3);
  font-size:.75rem;border-radius:99px;padding:4px 11px}
.wa-b .chi{display:block;font-size:.68rem;opacity:.6;margin-bottom:2px}
.wa-p{display:flex;gap:7px;padding:10px 13px;border-top:1px solid var(--bord);background:var(--carta)}
.wa-p input{flex:1;padding:.52em .85em;border-radius:99px;border:1px solid var(--bord);
  background:var(--carta2);font-size:.86rem}
.wa-p input:focus{outline:none;border-color:var(--ottone)}
.wa-p button{width:38px;height:38px;border-radius:99px;background:#25D366;color:#fff;display:grid;
  place-items:center;flex:none}
.wa-rap{display:flex;gap:6px;padding:9px 13px 0;flex-wrap:wrap;background:var(--carta)}
.wa-rap button{padding:.3em .72em;border-radius:99px;border:1px solid var(--bord);font-size:.76rem;
  background:var(--carta2)}

/* ---------- incassi ---------- */
.barre{display:flex;align-items:flex-end;gap:9px;height:190px;margin:16px 0 6px}
.barre .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;
  gap:5px;height:100%}
.barre .col i{width:100%;background:var(--inch);border-radius:3px 3px 0 0;display:block;
  transition:height .5s}
.barre .col.pros i{background:repeating-linear-gradient(45deg,var(--ottone),var(--ottone) 5px,
  var(--ottone-s) 5px,var(--ottone-s) 10px)}
.barre .col span{font-size:.68rem;color:var(--tx3)}
.barre .col b{font-size:.72rem;font-weight:400;color:var(--tx2)}
.quota{display:flex;height:26px;border-radius:4px;overflow:hidden;margin-bottom:12px}
.quota div{display:grid;place-items:center;font-size:.73rem;color:#fff;transition:width .5s}
.riga-p{display:flex;justify-content:space-between;gap:12px;padding:9px 0;
  border-bottom:1px solid var(--bord);font-size:.87rem}
.riga-p:last-child{border:none}
.riga-p b{font-weight:400;font-variant-numeric:tabular-nums}

/* ---------- magazzino ---------- */
.scorta{height:5px;border-radius:99px;background:var(--bord);overflow:hidden;min-width:70px}
.scorta i{display:block;height:100%;background:var(--ok)}
.scorta.basso i{background:var(--ko)}

/* ---------- cassetto ---------- */
.cass{position:fixed;right:0;top:0;bottom:0;width:min(420px,94vw);background:var(--carta);
  border-left:1px solid var(--bord);box-shadow:-18px 0 50px -22px var(--om);z-index:84;
  transform:translateX(101%);transition:transform .3s cubic-bezier(.4,0,.2,1);overflow-y:auto;
  padding:18px}
.cass.on{transform:none}
.cass .c-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;
  margin-bottom:14px}
.cass h2{font-size:1.3rem}
.velo{position:fixed;inset:0;background:rgba(16,13,12,.42);z-index:81;opacity:0;pointer-events:none;
  transition:.28s}
.velo.on{opacity:1;pointer-events:auto}
.dett{display:grid;gap:1px;background:var(--bord);border:1px solid var(--bord);border-radius:5px;
  overflow:hidden;margin-bottom:14px}
.dett div{background:var(--carta);padding:9px 12px;display:flex;justify-content:space-between;
  gap:12px;font-size:.86rem}
.dett div span{color:var(--tx3)}
.dett div b{font-weight:400;text-align:right}

.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,14px);z-index:95;
  background:var(--inch);color:#fff;padding:13px 18px;border-radius:4px;font-size:.87rem;
  max-width:min(460px,92vw);box-shadow:0 20px 40px -18px rgba(0,0,0,.5);opacity:0;
  pointer-events:none;transition:.3s;border-left:2px solid var(--ottone)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}

@media(max-width:1080px){ .g4{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:1fr} }
@media(max-width:900px){
  .g2{grid-template-columns:1fr}
  .wa{grid-template-columns:1fr;height:auto}
  .wa-el{max-height:230px;border-right:none;border-bottom:1px solid var(--bord)}
  .wa-msg{height:320px}
  .pagina{padding:15px 12px 30px}
  .barra{padding:10px 12px}
}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>
