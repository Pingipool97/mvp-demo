const $=(s,e)=>(e||document).querySelector(s);
const $$=(s,e)=>[...(e||document).querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eur=n=>Math.round(n).toLocaleString('it-IT')+' €';
const voto1=v=>Number(v).toFixed(1).replace('.',',');

/* =========================================================
   MEMORIA CONDIVISA COL GESTIONALE
   ========================================================= */
let TRATT=TRATT_DEF, SQUADRA=SQUADRA_DEF, ORARI=ORARI_DEF, PREN=[], CHIUSURE=[];
function leggi(){
  const p=(k,d)=>{ try{ const v=JSON.parse(localStorage.getItem('naif_'+k)||'null');
    return v==null?d:v; }catch(e){ return d; } };
  const t=p('trattamenti',null); if(Array.isArray(t)&&t.length) TRATT=t;
  const s=p('squadra',null);     if(Array.isArray(s)&&s.length) SQUADRA=s;
  const o=p('orari',null);       if(Array.isArray(o)&&o.length===7) ORARI=o;
  PREN=p('prenotazioni',[])||[];
  CHIUSURE=p('chiusure',[])||[];
}
leggi();
const attivi=()=>TRATT.filter(t=>t.attivo!==false);
const inSquadra=id=>SQUADRA.find(p=>p.id===id);
const REPARTO_DI_AREA={capelli:'capelli',barbershop:'barbershop',
  viso:'estetica',corpo:'estetica',epilazione:'estetica',unghie:'estetica'};
const personeDi=area=>SQUADRA.filter(p=>p.attivo!==false&&p.reparto===REPARTO_DI_AREA[area]);
const REPARTI=[['capelli','Sala capelli'],['barbershop','Barbershop'],['estetica','Estetica']];

function minuti(h){ const p=String(h).split(':').map(Number); return p[0]*60+p[1]; }
function hhmm(m){ return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')
  +'-'+String(d.getDate()).padStart(2,'0'); }
const chiusoIl=gi=>CHIUSURE.some(c=>c.data===gi)||!ORARI[new Date(gi+'T12:00:00').getDay()].ap;
function durata(m){
  if(m>=60){ const h=Math.floor(m/60), r=m%60;
    return h+(h>1?' ore':' ora')+(r?' '+r+'′':''); }
  return m+' minuti';
}

function disegnaListino(){

  $('#listino-elenco').innerHTML=cats.map(c=>{

    const area=AREE.find(a=>a.id===voci[0].area);

/* ---------- disponibilità ---------- */
function prenDelGiorno(gi){ return PREN.filter(p=>p.giorno===gi&&p.stato!=='annullata'); }
function occupataIn(lista,chi,ora,dur){
  const a=minuti(ora), b=a+dur;
  return lista.some(p=>{
    if(p.persona!==chi) return false;
    const t=TRATT.find(x=>x.id===p.tratt), d=t?t.min:30;
    const x=minuti(p.ora), y=x+d;
    return a<y && x<b;
  });
}
function orariDelGiorno(gi){
  if(chiusoIl(gi)) return null;
  const o=ORARI[new Date(gi+'T12:00:00').getDay()];
  const t=TRATT.find(x=>x.id===S.tratt), dur=t?t.min:30;
  const lista=prenDelGiorno(gi), ora=new Date(), oggi=iso(ora);
  const adesso=ora.getHours()*60+ora.getMinutes();
  const gente=(S.persona&&S.persona!=='chiunque') ? [S.persona]
    : personeDi(t?t.area:'capelli').map(p=>p.id);
  const out=[];
  for(let m=minuti(o.ap); m+dur<=minuti(o.ch); m+=30){
    const h=hhmm(m);
    let pieno=gente.every(id=>occupataIn(lista,id,h,dur));
    if(gi<oggi) pieno=true;
    if(gi===oggi&&m<=adesso) pieno=true;
    out.push({ora:h,pieno:pieno});
  }
  return out;
}

/* ---------- calendario ---------- */
const GIORNI_PRENOTABILI=60;
const DOW=['lun','mar','mer','gio','ven','sab','dom'];
let calMese=new Date(new Date().getFullYear(),new Date().getMonth(),1,12);
function ultimoPrenotabile(){ const d=new Date();
  d.setDate(d.getDate()+GIORNI_PRENOTABILI); return iso(d); }
function disegnaCal(){
  const oggi=iso(new Date()), fine=ultimoPrenotabile();
  const anno=calMese.getFullYear(), mese=calMese.getMonth();
  const et=calMese.toLocaleDateString('it-IT',{month:'long',year:'numeric'});
  $('#cal-mese').textContent=et[0].toUpperCase()+et.slice(1);
  const salta=(new Date(anno,mese,1,12).getDay()+6)%7;
  const quanti=new Date(anno,mese+1,0).getDate();
  let h=DOW.map(g=>'<div class="dow">'+g+'</div>').join('');
  for(let i=0;i<salta;i++) h+='<div class="cal-d fuori"></div>';
  for(let n=1;n<=quanti;n++){
    const gi=iso(new Date(anno,mese,n,12));
    let cl='cal-d', punto='', bloccato=false;
    if(gi===oggi) cl+=' oggi';
    if(gi<oggi||gi>fine){ cl+=' no'; bloccato=true; }
    else{
      const sl=orariDelGiorno(gi);
      if(!sl){ cl+=' no'; bloccato=true; }
      else{
        const liberi=sl.filter(s=>!s.pieno).length;
        punto='<i></i>';
        if(!liberi){ cl+=' pieno'; bloccato=true; }
        else if(liberi<=3) cl+=' pochi';
      }
    }
    if(gi===S.giorno) cl+=' on';
    h+= bloccato ? '<div class="'+cl+'">'+n+punto+'</div>'
      : '<button class="'+cl+'" data-g="'+gi+'">'+n+punto+'</button>';
  }
  $('#cal-g').innerHTML=h;
  $$('#cal-g [data-g]').forEach(b=>b.onclick=()=>{
    S.giorno=b.dataset.g; S.ora=null;
    disegnaCal(); disegnaOre(); disegnaPassi();
  });
  const mOggi=new Date().getFullYear()*12+new Date().getMonth();
  const mFine=new Date(fine+'T12:00:00');
  $('#cal-prima').disabled=anno*12+mese<=mOggi;
  $('#cal-dopo').disabled =anno*12+mese>=mFine.getFullYear()*12+mFine.getMonth();
}
function disegnaOre(){
  const cont=$('#ore'), et=$('#cal-giorno'), nota=$('#nota-ore');
  if(!S.giorno){ cont.innerHTML=''; nota.textContent='';
    et.textContent='Scegli un giorno dal calendario'; return; }
  const d=new Date(S.giorno+'T12:00:00');
  et.textContent=GIORNI[d.getDay()]+' '+d.getDate()+' '
    +d.toLocaleDateString('it-IT',{month:'long'});
  
  const sl=orariDelGiorno(S.giorno);
  if(!sl){ cont.innerHTML=''; nota.textContent='Quel giorno il salone è chiuso.'; return; }
  const fasce=[['Mattina',s=>minuti(s.ora)<13*60],['Pomeriggio',s=>minuti(s.ora)>=13*60]];
  cont.innerHTML=fasce.map(f=>{
    const v=sl.filter(f[1]);
    if(!v.length) return '';
    return '<div class="fascia-ore"><h5>'+f[0]+'</h5><div class="ore">'+v.map(s=>
      '<button class="ora'+(s.pieno?' pieno':'')+(S.ora===s.ora?' on':'')+'" data-o="'+s.ora
      +'">'+s.ora+'</button>').join('')+'</div></div>';
  }).join('');
  $$('#ore .ora').forEach(b=>b.onclick=()=>{
    S.ora=b.dataset.o;
    $$('#ore .ora').forEach(x=>x.classList.toggle('on',x===b));
    disegnaPassi();
  });
  const liberi=sl.filter(s=>!s.pieno).length;
  nota.textContent= liberi ? liberi+' orari liberi in questa giornata.'
    : 'Nessun orario libero, prova un altro giorno.';
}

/* ---------- passi ---------- */
function disegnaPassi(){
  $$('#tappe .tappa').forEach(t=>{
    const n=+t.dataset.p;
    t.classList.toggle('on',n===S.passo);
    t.classList.toggle('fatta',n<S.passo);
    t.onclick=n<S.passo?()=>{ S.passo=n; disegnaPassi(); }:null;
  });
  for(let i=1;i<=4;i++) $('#passo-'+i).hidden=(i!==S.passo);
  $('#palco-tit').textContent=TESTATE[S.passo][0];
  $('#palco-sotto').textContent=TESTATE[S.passo][1];
  const t=S.tratt?TRATT.find(x=>x.id===S.tratt):null;
  $('#v-tratt').textContent=t?t.nome:'da scegliere';
  $('#v-persona').textContent=S.persona?nomePersona(S.persona):'da scegliere';
  $('#v-quando').textContent=S.giorno&&S.ora
    ? dataBreve(S.giorno)+' alle '+S.ora : 'da scegliere';
  const nome=$('#c-nome').value.trim();
  $('#v-dati').textContent=nome||'da compilare';
  $('#v-prezzo').textContent=t?eur(t.prezzo):'0 €';
  $('#b-indietro').hidden=S.passo===1;
  const b=$('#b-avanti');
  b.innerHTML= S.passo===4 ? 'Conferma l\'appuntamento<svg><use href="#i-ok"/></svg>'
    : 'Avanti<svg><use href="#i-dx"/></svg>';
  b.disabled=(S.passo===1&&!S.tratt)||(S.passo===2&&!S.persona)
    ||(S.passo===3&&!(S.giorno&&S.ora));
  $('#scelto').textContent = S.passo===4&&t
    ? durata(t.min)+' con '+nomePersona(S.persona) : '';
}
function dataBreve(s){ const d=new Date(s+'T12:00:00');
  return GG[d.getDay()]+' '+d.getDate()+'/'+(d.getMonth()+1); }
function avanti(){
  if(S.passo===4){ conferma(); return; }
  S.passo++;
  if(S.passo===2) disegnaSceltaPersona();
  if(S.passo===3){ disegnaCal(); disegnaOre(); }
  disegnaPassi();
  $('.palco').scrollTop=0;
}
function indietro(){ if(S.passo>1){ S.passo--; disegnaPassi(); $('.palco').scrollTop=0; } }
function conferma(){
  let ok=true;
  [['#c-nome',v=>v.trim().length>2],['#c-tel',v=>v.replace(/\D/g,'').length>=8]]
   .forEach(par=>{ const el=$(par[0]), c=el.closest('.campo'), buono=par[1](el.value);
     c.classList.toggle('ko',!buono); if(!buono) ok=false; });
  if(!ok) return;
  const t=TRATT.find(x=>x.id===S.tratt);
  let chi=S.persona;
  if(chi==='chiunque'){
    const lista=prenDelGiorno(S.giorno);
    const libera=personeDi(t.area).find(p=>!occupataIn(lista,p.id,S.ora,t.min));
    chi=libera?libera.id:personeDi(t.area)[0].id;
  }
  PREN.push({id:'w'+Date.now(),tratt:S.tratt,persona:chi,giorno:S.giorno,ora:S.ora,
    nome:$('#c-nome').value.trim(),tel:$('#c-tel').value.trim(),mail:$('#c-mail').value.trim(),
    note:$('#c-note').value.trim(),prezzo:t.prezzo,origine:'sito',stato:'confermata',nuova:true});
  try{ localStorage.setItem('naif_prenotazioni',JSON.stringify(PREN)); }catch(e){}
  const d=new Date(S.giorno+'T12:00:00');
  messaggio('Appuntamento confermato: '+t.nome+' con '+nomePersona(chi)+', '
    +GIORNI[d.getDay()]+' '+d.getDate()+' '+d.toLocaleDateString('it-IT',{month:'long'})
    +' alle '+S.ora+'. Lo trovi già nell\'agenda del salone.');
  S.passo=1; S.tratt=null; S.persona=null; S.giorno=null; S.ora=null;
  ['#c-nome','#c-tel','#c-mail','#c-note'].forEach(s=>$(s).value='');
  chiudiScheda();
  disegnaSceltaTratt(); disegnaPassi(); disegnaCal(); disegnaOre();
}

function messaggio(t){
  $('#toast').textContent=t;
  $('#toast').classList.add('on');
  clearTimeout(messaggio.t);
  messaggio.t=setTimeout(()=>$('#toast').classList.remove('on'),7000);
}

/* =========================================================
   AVVIO
   ========================================================= */
(function(){
  $('#c-anni').textContent=new Date().getFullYear()-SALONE.dal;
  disegnaGuida(); disegnaFasce(); disegnaIndice(); disegnaListino(); disegnaSquadra();
  disegnaRecensione(); disegnaFoto(); disegnaOrari(); disegnaMappa();
  disegnaDifetti(); disegnaConto(); disegnaPassi();

  const testo=encodeURIComponent('Buongiorno, scrivo dal sito. Vorrei prenotare');
  ['#wa-guida','#wa-contatti'].forEach(s=>{ const a=$(s);
    if(a) a.href='https://wa.me/'+SALONE.wa+'?text='+testo; });

  $('#q').addEventListener('input',e=>{ cerca=e.target.value; disegnaListino(); });
  $('#apri-scheda').onclick=apriScheda;
  $('#apri-scheda-2').onclick=apriScheda;
  $('#chiudi-scheda').onclick=chiudiScheda;
  $('#b-avanti').onclick=avanti;
  $('#b-indietro').onclick=indietro;
  $('#c-nome').addEventListener('input',disegnaPassi);
  $('#cal-prima').onclick=()=>{
    calMese=new Date(calMese.getFullYear(),calMese.getMonth()-1,1,12); disegnaCal(); };
  $('#cal-dopo').onclick=()=>{
    calMese=new Date(calMese.getFullYear(),calMese.getMonth()+1,1,12); disegnaCal(); };
  $('#rec-prima').onclick=()=>{
    recVista=(recVista-1+RECENSIONI.length)%RECENSIONI.length; disegnaRecensione(); };
  $('#rec-dopo').onclick=()=>{
    recVista=(recVista+1)%RECENSIONI.length; disegnaRecensione(); };
  $('#apri-pres').onclick=()=>{ $('#pres').classList.add('on'); $('#velo').classList.add('on'); };
  const chiudiPres=()=>{ $('#pres').classList.remove('on'); $('#velo').classList.remove('on'); };
  $('#chiudi-pres').onclick=chiudiPres;
  $('#velo').onclick=chiudiPres;
  $('#lente').onclick=()=>$('#lente').classList.remove('on');
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'){
    chiudiPres(); $('#lente').classList.remove('on');
    if($('#scheda').classList.contains('on')) chiudiScheda(); }});

  const oss=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting)
    $$('#punti a').forEach(a=>a.classList.toggle('on',a.dataset.s===e.target.id)); }),
    {rootMargin:'-45% 0px -50% 0px'});
  $$('section[id]').forEach(s=>oss.observe(s));

  addEventListener('storage',e=>{
    if(String(e.key||'').startsWith('naif_')){
      leggi(); disegnaFasce(); disegnaIndice(); disegnaListino(); disegnaSquadra();
      disegnaOrari(); disegnaConto(); disegnaSceltaTratt(); disegnaCal(); disegnaOre();
      messaggio('Il salone ha aggiornato il listino, gli orari o l\'agenda.');
    }
  });
})();
