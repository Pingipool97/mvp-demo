<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Naïf Hair&amp;Beauty · Varedo</title>
<meta name="description" content="Parrucchiere, barbershop ed estetica a Varedo dal 1979. Ottantacinque trattamenti a listino e prenotazione online.">
<style>
@font-face{font-family:'Playfair';src:url({{ASSET:playfair.woff2}}) format('woff2');font-weight:400 700;font-display:swap}
@font-face{font-family:'Jost';src:url({{ASSET:jost.woff2}}) format('woff2');font-weight:300 600;font-display:swap}

/* colori presi dalle foto del salone: mattone, cuoio, ottone, pareti sabbia */
:root{
  --inch:#171310; --inch-2:#241D18;
  --ottone:#A97C4A; --ottone-s:#8A6136; --ottone-c:#E9D9C3;
  --crema:#F6F2EB; --sabbia:#EBE3D7; --carta:#FFFFFF;
  --tx:#171310; --tx2:#59504A; --tx3:#948A7F;
  --filo:#DCD1C1; --om:rgba(23,19,16,.16);
  --rail:66px;
}
*{box-sizing:border-box;margin:0;padding:0}
/* display:grid o flex battono l'attributo hidden: qui non succede */
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{font-family:'Jost',system-ui,sans-serif;background:var(--crema);color:var(--tx);
  font-size:16.5px;font-weight:300;line-height:1.62;overflow-x:hidden}
h1,h2,h3,h4,.pf{font-family:'Playfair',Georgia,serif;font-weight:400;line-height:1.05;
  letter-spacing:-.012em}
h1{font-size:clamp(3rem,8.4vw,7.4rem)}
h2{font-size:clamp(2.2rem,5.2vw,4.2rem)}
h3{font-size:1.6rem}
p{color:var(--tx2)}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
img{max-width:100%;display:block}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.4;
  stroke-linecap:round;stroke-linejoin:round}
::selection{background:var(--ottone);color:#fff}
:focus-visible{outline:2px solid var(--ottone);outline-offset:3px}
.et{font-size:.68rem;letter-spacing:.34em;text-transform:uppercase;color:var(--ottone)}
.num{font-variant-numeric:tabular-nums}

/* ================= IMPIANTO A RIVISTA =================
   niente barra in alto: il corpo scorre e la navigazione sta
   su una guida verticale a destra                        */
.foglio{padding-right:var(--rail)}
.riga{width:min(1240px,100%);margin:0 auto;padding:0 clamp(18px,4vw,54px)}
.griglia{display:grid;grid-template-columns:repeat(12,1fr);gap:clamp(14px,2vw,28px)}
.sez{padding:clamp(70px,9vw,132px) 0;position:relative}
.sez+.sez{border-top:1px solid var(--filo)}
.scura{background:var(--inch);color:#fff;border-top:none!important}
.scura p{color:rgba(255,255,255,.66)}
.scura .et{color:var(--ottone-c)}

/* guida di navigazione a destra */
.guida{position:fixed;right:0;top:0;bottom:0;width:var(--rail);z-index:70;background:var(--crema);
  border-left:1px solid var(--filo);display:flex;flex-direction:column;align-items:center;
  padding:16px 0;gap:14px}
.guida .marchio{writing-mode:vertical-rl;font-size:.63rem;letter-spacing:.34em;
  text-transform:uppercase;color:var(--tx3)}
.guida .punti{margin:auto 0;display:flex;flex-direction:column;gap:15px;align-items:center}
.guida .punti a{width:24px;height:24px;display:grid;place-items:center;position:relative}
.guida .punti a i{width:6px;height:6px;border-radius:99px;background:var(--filo);display:block;
  transition:.2s}
.guida .punti a:hover i{background:var(--tx3);transform:scale(1.4)}
.guida .punti a.on i{background:var(--ottone);transform:scale(1.7)}
.guida .punti a span{position:absolute;right:30px;top:50%;transform:translateY(-50%) translateX(6px);
  background:var(--inch);color:#fff;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;
  padding:.36em .7em;white-space:nowrap;opacity:0;pointer-events:none;transition:.2s}
.guida .punti a:hover span{opacity:1;transform:translateY(-50%)}
.guida .basso{display:flex;flex-direction:column;gap:10px;align-items:center}
.guida .basso a{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--filo);
  border-radius:99px;transition:.18s}
.guida .basso a:hover{background:var(--inch);color:#fff;border-color:var(--inch)}
.guida .basso .wa{background:#25D366;border-color:#25D366;color:#0B2117}

/* bottoni */
.b{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:1em 1.9em;
  font-size:.73rem;letter-spacing:.22em;text-transform:uppercase;cursor:pointer;
  border:1px solid transparent;transition:.22s;white-space:nowrap;position:relative}
.b svg{width:15px;height:15px}
.b-p{background:var(--inch);color:#fff}
.b-p:hover{background:var(--ottone)}
.b-o{background:var(--ottone);color:#fff}
.b-o:hover{background:var(--ottone-s)}
.b-c{border-color:currentColor}
.b-c:hover{background:var(--inch);color:#fff;border-color:var(--inch)}
.scura .b-c:hover{background:#fff;color:var(--inch);border-color:#fff}
.b-sm{padding:.62em 1.15em;font-size:.68rem;letter-spacing:.18em}
.b[disabled]{opacity:.32;pointer-events:none}

/* ================= COPERTINA ================= */
.cop{min-height:100svh;display:flex;align-items:stretch;position:relative;padding:0}
.cop .visivo{position:absolute;inset:0;background-size:cover;background-position:center 42%}
.cop .visivo::after{content:"";position:absolute;inset:0;
  background:linear-gradient(105deg,rgba(23,19,16,.92) 0%,rgba(23,19,16,.7) 44%,rgba(23,19,16,.42) 100%),
    linear-gradient(0deg,rgba(23,19,16,.55),transparent 46%)}
.cop .riga{position:relative;z-index:2;display:flex;align-items:flex-end;padding-bottom:clamp(40px,7vw,86px);
  padding-top:clamp(80px,10vw,120px)}
.cop-in{color:#fff;width:100%}
.cop .anno{writing-mode:vertical-rl;position:absolute;left:clamp(18px,4vw,54px);top:24%;
  font-size:.66rem;letter-spacing:.5em;text-transform:uppercase;color:rgba(255,255,255,.5)}
.cop .stemma{display:block;width:min(210px,44vw);margin-bottom:clamp(20px,3vw,34px)}
.cop .stemma img{width:100%;filter:invert(1) brightness(2.4)}
.cop h1{color:#fff}
.cop h1 em{font-style:italic;color:var(--ottone-c);display:block}
.cop .sotto{color:rgba(255,255,255,.78);max-width:44ch;margin-top:22px;font-size:1.06rem}
.cop .azioni{display:flex;gap:11px;flex-wrap:wrap;margin-top:34px}
.cop .conta{position:absolute;right:clamp(18px,4vw,54px);bottom:clamp(40px,7vw,86px);
  text-align:right;color:rgba(255,255,255,.62);font-size:.68rem;letter-spacing:.2em;
  text-transform:uppercase;z-index:2}
.cop .conta b{display:block;font-family:'Playfair',serif;font-size:2.4rem;color:#fff;
  letter-spacing:0;line-height:1.1}

/* ================= MANIFESTO ================= */
.man .nota-lato{grid-column:1/4;border-top:2px solid var(--inch);padding-top:14px}
.man .nota-lato b{display:block;font-family:'Playfair',serif;font-size:1.2rem;margin-bottom:5px}
.man .nota-lato span{font-size:.86rem;color:var(--tx3)}
.man .testo{grid-column:5/13}
.man .testo p{font-size:1.16rem;margin-bottom:16px}
.man .testo p:first-of-type::first-letter{font-family:'Playfair',serif;font-size:3.6rem;
  float:left;line-height:.86;padding:4px 12px 0 0;color:var(--ottone)}
.man .gen{margin-top:34px;display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.man .gen div{border-top:1px solid var(--filo);padding-top:12px}
.man .gen b{display:block;font-family:'Playfair',serif;font-size:1.06rem}
.man .gen span{font-size:.83rem;color:var(--tx3);line-height:1.5;display:block;margin-top:3px}

/* ================= REPARTI A FASCE ================= */
.fascia{display:grid;grid-template-columns:repeat(12,1fr);gap:0;align-items:center;
  border-top:1px solid var(--filo);min-height:min(78vh,620px)}
.fascia:first-child{border-top:none}
.fascia .im{grid-column:1/6;align-self:stretch;background-size:cover;background-position:center;
  min-height:320px}
.fascia .tx{grid-column:7/12;padding:clamp(30px,4vw,52px) 0}
.fascia.gira .im{grid-column:8/13;grid-row:1}
.fascia.gira .tx{grid-column:2/7;grid-row:1}
.fascia .n{font-family:'Playfair',serif;font-size:3.4rem;color:var(--filo);line-height:1;
  display:block;margin-bottom:6px}
.fascia h3{font-size:clamp(2rem,3.6vw,3rem);margin-bottom:12px}
.fascia .assaggio{margin:22px 0;display:grid;gap:1px;background:var(--filo);border-top:1px solid var(--filo);
  border-bottom:1px solid var(--filo)}
.fascia .assaggio div{background:var(--crema);display:flex;justify-content:space-between;gap:14px;
  padding:9px 0;font-size:.92rem}
.fascia .assaggio span{color:var(--tx2)}
.fascia .assaggio b{font-family:'Playfair',serif;font-weight:400;font-size:1.06rem}

/* ================= LISTINO ================= */
.listino{display:grid;grid-template-columns:220px 1fr;gap:clamp(24px,4vw,56px);align-items:start}
.indice{position:sticky;top:26px}
.indice .cerca{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--inch);
  padding-bottom:8px;margin-bottom:18px}
.indice .cerca input{border:none;background:none;outline:none;width:100%;font-size:.95rem}
.indice a{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:.86rem;
  color:var(--tx2);border-bottom:1px solid var(--filo);transition:.16s;cursor:pointer}
.indice a:hover{color:var(--tx);padding-left:5px}
.indice a.on{color:var(--ottone);font-weight:400}
.indice a span{color:var(--tx3);font-size:.78rem}
.menu-gr{margin-bottom:38px}
.menu-gr h3{font-size:1.9rem;margin-bottom:4px}
.menu-gr .sotto-t{font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;color:var(--tx3);
  margin-bottom:14px}
.piatto{display:grid;grid-template-columns:1fr auto;gap:2px 14px;padding:11px 0;cursor:pointer;
  border-bottom:1px dotted var(--filo);transition:.16s}
.piatto:hover{background:linear-gradient(90deg,rgba(169,124,74,.07),transparent 70%)}
.piatto .n{font-size:1.04rem}
.piatto .p{font-family:'Playfair',serif;font-size:1.24rem;white-space:nowrap}
.piatto .d{grid-column:1/2;font-size:.84rem;color:var(--tx3);line-height:1.45}
.piatto .m{grid-column:2;text-align:right;font-size:.74rem;color:var(--tx3);letter-spacing:.1em;
  text-transform:uppercase}
.vuoto-l{padding:40px 0;color:var(--tx3)}

/* ================= SQUADRA A NASTRO ================= */
.nastro{display:flex;gap:0;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:thin;
  border-top:1px solid var(--filo);border-bottom:1px solid var(--filo)}
.nastro .p{flex:0 0 clamp(200px,22vw,262px);scroll-snap-align:start;padding:26px 22px;
  border-right:1px solid var(--filo);transition:.2s;cursor:default}
.nastro .p:hover{background:var(--carta)}
.nastro .p .r{font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;color:var(--ottone)}
.nastro .p b{display:block;font-family:'Playfair',serif;font-size:2rem;font-weight:400;
  margin:10px 0 4px}
.nastro .p small{font-size:.84rem;color:var(--tx3);display:block}
.nastro .p .v{margin-top:16px;padding-top:12px;border-top:1px solid var(--filo);font-size:.82rem;
  color:var(--tx2)}
.nastro .p .v b{display:inline;font-size:1.06rem}
.rep-ban{display:flex;align-items:baseline;gap:14px;margin:30px 0 12px}
.rep-ban h4{font-size:1.3rem}
.rep-ban span{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--tx3)}
.rep-ban i{flex:1;height:1px;background:var(--filo)}

/* ================= RECENSIONI ================= */
.rec-g{display:grid;grid-template-columns:repeat(12,1fr);gap:clamp(14px,2vw,28px);align-items:center}
.rec-voto{grid-column:1/4}
.rec-voto b{font-family:'Playfair',serif;font-size:clamp(4rem,9vw,6.4rem);line-height:.9;display:block}
.rec-voto .stelle{color:var(--ottone-c);letter-spacing:.24em;margin:10px 0 6px}
.rec-voto span{font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(255,255,255,.5)}
.rec-corpo{grid-column:5/13;min-height:210px;display:flex;flex-direction:column;
  justify-content:center}
.rec-corpo blockquote{font-family:'Playfair',serif;font-size:clamp(1.5rem,3vw,2.3rem);
  line-height:1.28;font-style:italic;color:#fff}
.rec-corpo .chi{margin-top:20px;font-size:.8rem;letter-spacing:.12em;color:rgba(255,255,255,.55)}
.rec-corpo .chi b{color:#fff;font-weight:400}
.rec-frecce{display:flex;gap:9px;margin-top:26px}
.rec-frecce button{width:40px;height:40px;border:1px solid rgba(255,255,255,.28);border-radius:99px;
  display:grid;place-items:center;color:#fff;transition:.18s}
.rec-frecce button:hover{background:#fff;color:var(--inch);border-color:#fff}

/* ================= FOTO A SCORRIMENTO ================= */
.strip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:12px;
  scrollbar-width:thin}
.strip figure{flex:0 0 clamp(260px,34vw,440px);scroll-snap-align:center;cursor:zoom-in;margin:0}
.strip figure div{aspect-ratio:4/3;background-size:cover;background-position:center;
  transition:filter .4s}
.strip figure:hover div{filter:brightness(1.08)}
.strip figcaption{font-size:.78rem;color:var(--tx3);margin-top:8px;letter-spacing:.04em}
.lente{position:fixed;inset:0;background:rgba(14,11,9,.95);z-index:140;display:none;
  place-items:center;padding:24px}
.lente.on{display:grid}
.lente img{max-width:min(1100px,94vw);max-height:86vh;object-fit:contain}
.lente .x{position:absolute;top:20px;right:22px;color:#fff;width:42px;height:42px;border-radius:99px;
  background:rgba(255,255,255,.14);display:grid;place-items:center}

/* ================= CONTATTI ================= */
.cont-g{display:grid;grid-template-columns:repeat(12,1fr);gap:clamp(16px,2.4vw,34px)}
.cont-g .col1{grid-column:1/5}
.cont-g .col2{grid-column:5/9}
.cont-g .col3{grid-column:9/13}
.dato{padding:13px 0;border-top:1px solid rgba(255,255,255,.16)}
.dato h4{font-family:'Jost',sans-serif;font-weight:400;font-size:.66rem;letter-spacing:.24em;
  text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:5px}
.dato p{color:#fff;font-size:1rem}
.dato a:hover{color:var(--ottone-c)}
.orari{width:100%;border-collapse:collapse;font-size:.94rem;color:#fff}
.orari td{padding:9px 0;border-top:1px solid rgba(255,255,255,.16)}
.orari td:last-child{text-align:right;font-family:'Playfair',serif;font-size:1.04rem}
.orari tr.oggi td{color:var(--ottone-c)}
.orari tr.oggi td:first-child::after{content:" · oggi";font-size:.7rem;letter-spacing:.1em}
.orari tr.chiuso td{color:rgba(255,255,255,.42)}
.mappa{margin-top:16px;border:1px solid rgba(255,255,255,.16);aspect-ratio:16/11;overflow:hidden}
.mappa svg{width:100%;height:100%}
.piede{padding:26px 0;font-size:.78rem;color:rgba(255,255,255,.4);display:flex;
  justify-content:space-between;gap:14px;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.16);
  margin-top:34px}

/* ================= SCHEDA DI PRENOTAZIONE (sopra la pagina) ================= */
.scheda{position:fixed;inset:0;z-index:130;background:var(--crema);display:none;
  grid-template-columns:340px 1fr}
.scheda.on{display:grid}
.scheda .lato{background:var(--inch);color:#fff;padding:clamp(20px,3vw,34px);display:flex;
  flex-direction:column;overflow-y:auto}
.scheda .lato .stemma{width:132px;margin-bottom:26px}
.scheda .lato .stemma img{width:100%;filter:invert(1) brightness(2.4)}
.tappe{display:grid;gap:2px;margin-bottom:auto}
.tappa{display:grid;grid-template-columns:26px 1fr;gap:12px;align-items:start;padding:13px 0;
  border-top:1px solid rgba(255,255,255,.14);opacity:.4;transition:.2s}
.tappa.on{opacity:1}
.tappa.fatta{opacity:.75;cursor:pointer}
.tappa i{width:26px;height:26px;border-radius:99px;border:1px solid rgba(255,255,255,.4);
  display:grid;place-items:center;font-style:normal;font-size:.72rem}
.tappa.on i{background:var(--ottone);border-color:var(--ottone)}
.tappa.fatta i{border-color:var(--ottone-c);color:var(--ottone-c)}
.tappa .t{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(255,255,255,.55)}
.tappa .v{font-family:'Playfair',serif;font-size:1.1rem;margin-top:2px;min-height:1.2em}
.scheda .lato .prezzo{border-top:1px solid rgba(255,255,255,.2);padding-top:16px;margin-top:16px;
  display:flex;justify-content:space-between;align-items:baseline}
.scheda .lato .prezzo b{font-family:'Playfair',serif;font-size:2rem}
.scheda .lato .prezzo span{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(255,255,255,.5)}
.scheda .palco{overflow-y:auto;padding:clamp(20px,3vw,40px)}
.scheda .palco-testa{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;
  margin-bottom:22px}
.scheda .palco-testa h2{font-size:clamp(1.7rem,3vw,2.4rem)}
.scheda .palco-testa p{font-size:.92rem;margin-top:6px;max-width:52ch}
.chiudi-t{width:42px;height:42px;border:1px solid var(--filo);border-radius:99px;display:grid;
  place-items:center;flex:none;transition:.18s;background:var(--carta)}
.chiudi-t:hover{background:var(--inch);color:#fff;border-color:var(--inch)}

.aree{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}
.aree button{padding:.48em 1.05em;border:1px solid var(--filo);font-size:.72rem;letter-spacing:.14em;
  text-transform:uppercase;background:var(--carta);transition:.16s;color:var(--tx2)}
.aree button:hover{border-color:var(--inch);color:var(--tx)}
.aree button.on{background:var(--inch);border-color:var(--inch);color:#fff}
.opzioni{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:7px}
.opz{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;
  padding:12px 14px;background:var(--carta);border:1px solid var(--filo);cursor:pointer;
  transition:.16s;color:var(--tx)}
.opz:hover{border-color:var(--inch)}
.opz.on{border-color:var(--ottone);box-shadow:inset 0 0 0 1px var(--ottone);
  background:color-mix(in srgb,var(--ottone) 8%,#fff)}
.opz .t{min-width:0}
.opz b{display:block;font-weight:400;font-size:.98rem;line-height:1.28}
.opz small{display:block;font-size:.77rem;color:var(--tx3);margin-top:1px}
.opz .p{font-family:'Playfair',serif;font-size:1.16rem;flex:none}
.opz .cerchio{width:34px;height:34px;border-radius:99px;background:var(--sabbia);
  color:var(--ottone-s);display:grid;place-items:center;font-family:'Playfair',serif;flex:none}
.opz .fianco{display:flex;align-items:center;gap:11px;min-width:0}
.opz .voto{font-size:.76rem;color:var(--ottone-s);flex:none}

.quando{display:grid;grid-template-columns:320px 1fr;gap:clamp(18px,3vw,34px);align-items:start}
.cal{background:var(--carta);border:1px solid var(--filo);padding:16px 18px 18px}
.cal-t{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.cal-t h4{font-size:1.1rem}
.cal-t .fr{display:flex;gap:6px}
.cal-t button{width:30px;height:30px;border:1px solid var(--filo);border-radius:99px;display:grid;
  place-items:center;transition:.16s}
.cal-t button:hover:not(:disabled){background:var(--inch);border-color:var(--inch);color:#fff}
.cal-t button:disabled{opacity:.2;pointer-events:none}
.cal-t button svg{width:14px;height:14px}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-g .dow{text-align:center;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--tx3);padding-bottom:6px}
.cal-d{aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;border:1px solid transparent;background:var(--sabbia);font-family:'Playfair',serif;
  font-size:1rem;cursor:pointer;transition:.14s;color:var(--tx)}
.cal-d:hover{border-color:var(--inch)}
.cal-d i{width:4px;height:4px;border-radius:99px;background:#6E9E4F;display:block}
.cal-d.pochi i{background:var(--ottone)}
.cal-d.fuori{background:transparent;visibility:hidden;pointer-events:none}
