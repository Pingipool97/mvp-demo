 {id:"ricostruzione-in-gel",area:"unghie",cat:"Manicure E Trattamenti Mani",nome:"Ricostruzione in Gel",desc:"Ottimi modi per aggiungere forza e lunghezza alle tue unghie naturali, extension e copertura delle unghie sono un'opzione ideale da considerare se hai un letto ungueale fragile o non hai la pazienza di farle crescere in modo naturale. Pensate per apparire tanto vere (o finte) a tuo piacimento, il procedimento è rapido e semplice, e ti donerà unghie eleganti e lucide per molte settimane.",min:120,prezzo:80,attivo:true},

 {id:"rimozione-acrilico-o-gel",area:"unghie",cat:"Manicure E Trattamenti Mani",nome:"Rimozione acrilico o gel",desc:"La cera: i motivi per cui la amiamo sono innumerevoli. Oltre ad essere ottima per la depilazione e per le labbra screpolate, la cera è il modo migliore per avere la pelle morbida come quella di un bebè. Se non sai cos'è un trattamento alla cera di paraffina, adesso te lo spieghiamo. Si tratta di un trattamento piacevole che idrata e ammorbidisce la pelle, donandole un calore terapeutico ideale per le articolazioni indolenzite e doloranti. Se soffri di artrite o semplicemente vuoi rinvigorire la pelle, è il momento di darsi alla cera...",min:30,prezzo:15,attivo:true},
 {id:"riparazione-unghia",area:"unghie",cat:"Manicure E Trattamenti Mani",nome:"Riparazione Unghia",desc:"All hail our nails! For tidy cuticles and strong and sturdy tips that won’t break, it’s always worth calling in the professionals. Using a wealth of fortifying lotions and potions, your nail technician will be able to strengthen even the frailest of nails.",min:15,prezzo:5,attivo:true},
 {id:"pedicure-estetico",area:"unghie",cat:"Pedicure E Trattamenti Piedi",nome:"Pedicure estetico",desc:"Ideale per rimuovere le cellule della pelle morta dai piedi, una pedicure rilassante ti permette di mantenere le unghie dei piedi in perfetto stato. Al temine del trattamento avrai dei piedi lisci, morbidi, con unghie in ordine e con un bellissimo smalto come tocco finale.",min:45,prezzo:25,attivo:true},
 {id:"pedicure-curativo",area:"unghie",cat:"Pedicure E Trattamenti Piedi",nome:"Pedicure curativo",desc:"Ideale per rimuovere le cellule della pelle morta dai piedi, una pedicure rilassante ti permette di mantenere le unghie dei piedi in perfetto stato. Al temine del trattamento avrai dei piedi lisci, morbidi, con unghie in ordine e con un bellissimo smalto come tocco finale.",min:60,prezzo:30,attivo:true},
 {id:"pedicure-estetico-semipermanente",area:"unghie",cat:"Pedicure E Trattamenti Piedi",nome:"Pedicure estetico + semipermanente",desc:"Vuoi avere piedini perfetti per almeno 2 settimane? Dedicati alla pedicure semi-permanente: è come la tua pedicure abituale, ma con uno smalto in gel anziché quello normale. Il risultato? Dita dei piedi luminose e impeccabili a lungo. Un sogno!",min:60,prezzo:45,attivo:true},
 {id:"pedicure-curativo-semipermanente",area:"unghie",cat:"Pedicure E Trattamenti Piedi",nome:"Pedicure Curativo Semipermanente",desc:"Vuoi avere piedini perfetti per almeno 2 settimane? Dedicati alla pedicure semi-permanente: è come la tua pedicure abituale, ma con uno smalto in gel anziché quello normale. Il risultato? Dita dei piedi luminose e impeccabili a lungo. Un sogno!",min:60,prezzo:55,attivo:true},
 {id:"applicazione-smalto-semipermanente",area:"unghie",cat:"Pedicure E Trattamenti Piedi",nome:"Applicazione Smalto Semipermanente Piedi",desc:"Vuoi avere piedini perfetti per almeno 2 settimane? Dedicati alla pedicure semi-permanente: è come la tua pedicure abituale, ma con uno smalto in gel anziché quello normale. Il risultato? Dita dei piedi luminose e impeccabili a lungo. Un sogno!",min:45,prezzo:30,attivo:true},
 {id:"rimozione-calli",area:"unghie",cat:"Pedicure E Trattamenti Piedi",nome:"Rimozione Calli",desc:"Se eviti sabot e scarpe slingback a causa della pelle indurita sui talloni, ora esiste un trattamento che fa per te. Il callus peeling è un modo semplice e indolore per sbarazzarsi della pelle secca che spesso si accumula sui piedi. Ecco un’ottima scusa per fare un po’ di shopping nel reparto scarpe aperte...",min:15,prezzo:10,attivo:true},
 {id:"epilazione-a-cera-sopracciglia",area:"viso",cat:"Definizione E Design Sopracciglia",nome:"Epilazione a Cera Sopracciglia",desc:"Rapida, delicata e duratura, la ceretta è un ottimo modo per definire la forma delle tue sopracciglia. La ceretta alle sopracciglia è ormai effettuata dalla maggior parte dei saloni di bellezza, e anche da quelli che non prendono appuntamento, quindi ormai è facilissimo avere bellissime sopracciglia.",min:15,prezzo:8,attivo:true},
 {id:"ceretta-alle-sopracciglia-uomo",area:"viso",cat:"Definizione E Design Sopracciglia",nome:"Ceretta alle sopracciglia - Uomo",desc:"Un servizio rapido e indolore. L'uso della cera garantisce un risultato perfetto e una ricrescita lenta.",min:15,prezzo:8,attivo:true},
 {id:"laminazione-sopracciglia",area:"viso",cat:"Definizione E Design Sopracciglia",nome:"Laminazione Sopracciglia",desc:"La laminazione delle sopracciglia è un trattamento estetico ideale per definire e controllare le sopracciglia ribelli. Il trattamento inizia con la pulizia dell'area da trattare e la pettinatura delle sopracciglia con prodotti speciali che ammorbidiscono i peli e li rendono gestibili. Successivamente, viene applicato un prodotto lisciante chimico che permette di fissare la forma delle sopracciglia e consente di definire la forma in modo permanente. Questo trattamento culmina con una profonda idratazione dell'area per un risultato bello, naturale e stilizzato.",min:45,prezzo:40,attivo:true},
 {id:"trattamento-curativo",area:"capelli",cat:"Trattamenti Per Cute E Capello",nome:"Trattamento curativo",desc:"Trattamento jurvedha",min:30,prezzo:10,attivo:true},
 {id:"trattamento-joico",area:"capelli",cat:"Trattamenti Per Cute E Capello",nome:"Trattamento Joico",desc:"Vuoi una chioma da incanto? I trattamenti emollienti per i capelli sono appositamente studiati per infondere nuova vita alla tua chioma, con ottimi risultati di bellezza e relax. Puoi dire addio ai danni causati da inquinamento, piastre per capelli ed esposizione prolungata al sole... E accogliere a braccia aperte una chioma super-liscia e brillante.",min:30,prezzo:27,attivo:true},
 {id:"raccolto",area:"capelli",cat:"Acconciatura",nome:"Raccolto",desc:"A volte, solo un’acconciatura raccolta è all’altezza della situazione. Dimentica il concetto di riccioloni stile Maria Antonietta o rigide acconciature da damigella d’onore: le moderne acconciature raccolte sono eleganti, chic e più trendy che mai.",min:60,prezzo:25,attivo:true},
 {id:"trucco",area:"viso",cat:"Make Up E PMU",nome:"Trucco",desc:"Certo, ormai sei un’artista con l’eyeliner, e tracci linee di una precisione che farebbe invidia a Giotto, ma a volte ci sono occasioni che richiedono qualcosa di super-speciale... Che fare in questi casi? Ideale per noi donne che desideriamo conoscere qualche trucchetto in più per il nostro trucco (e chi non lo vorrebbe?), il make up applicato da un esperto è un ottimo modo per darsi una carica di autostima, accentuando i lineamenti naturali per creare una versione più elegante di sé. Perché contorno occhi spesso e nero stile panda e strane ciglia finte sono ormai fuori moda…",min:60,prezzo:40,attivo:true},
 {id:"analisi-del-capello",area:"capelli",cat:"Consulenza",nome:"Analisi del Capello",desc:"Try before you buy. A hair consultation gives you the perfect opportunity to sit down with your hairdresser and have a proper chinwag about what you want and what would suit you best, before it’s time for the chop.",min:30,prezzo:1,attivo:true},
 {id:"taglio-donna",area:"capelli",cat:"Taglio",nome:"Taglio Donna",desc:"Con questo servizio in automatico verrà prenotata anche la piega",min:60,prezzo:40,attivo:true},
 {id:"taglio-corto-donna",area:"capelli",cat:"Taglio",nome:"Taglio corto donna",desc:"Taglio molto corto che non prevede una piega a phon",min:30,prezzo:20,attivo:true},
 {id:"taglio-unghie",area:"capelli",cat:"Taglio",nome:"Taglio unghie",desc:"Il taglio di capelli è il riflesso del carattere e della personalità di ciascuno. A seconda della forma del viso e della struttura del capello è possibile ritrovare il taglio più indicato che possa incorniciare il volto ed esaltarne le peculiarità.",min:15,prezzo:15,attivo:true},
 {id:"colpi-di-sole-media-lunghezza",area:"capelli",cat:"Colpi Di Sole",nome:"Colpi di Sole Media Lunghezza",desc:"",min:120,prezzo:95,attivo:true},
 {id:"colpi-di-sole-capelli-lunghi",area:"capelli",cat:"Colpi Di Sole",nome:"Colpi di sole capelli lunghi",desc:"I colpi di sole sono un servizio tecnico in grado di realizzare effetti che ricreano le schiariture donate dal sole a seguito di lunghe esposizioni alla luce. Il trattamento, destinato alle chiome lunghe, prevede di schiarire sottili ciocche di 1, massimo 2 toni, grazie all'applicazione del prodotto decolorante. Il risultato finale crea delle schiariture dall'effetto estremamente naturale, capaci di illuminare volto e chioma.",min:120,prezzo:105,attivo:true},
 {id:"piega-capelli-corti",area:"capelli",cat:"Piega",nome:"Piega Capelli Corti",desc:"Piega per capelli molto corti, questa opzione NON prevede l’utilizzo di conditioner ",min:30,prezzo:14,attivo:true},
 {id:"piega-capelli-media-lunghezza",area:"capelli",cat:"Piega",nome:"Piega Capelli Media Lunghezza",desc:"La piega, adatta alle capigliature di media lunghezza, è un tradizionale servizio stilistico che permette di lavorare sulla forma della capigliatura, generalmente a seguito di ulteriori trattamenti in salone. Gli hairstylist attraverso phon, spazzola e prodotti di finish realizzano forme e volumi, fissando la messa in piega ideale alla fisionomia del cliente. Con questa opzione è compreso shampoo e CONDITIONER",min:30,prezzo:20,attivo:true},
