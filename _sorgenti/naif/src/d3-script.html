(function semina(){
  if(PREN.some(p=>p.semina)) return;
  const nuovi=[];
  /* quanto lavora ogni reparto: l'estetica riempie meno slot, il sabato e' pieno per tutti */
  const carico={capelli:[0,0,.2,.23,.28,.4,.54],barbershop:[0,0,.18,.2,.25,.38,.52],
    estetica:[0,0,.15,.17,.21,.29,.4]};
  for(let g=-182; g<=42; g++){
    const d=piu(OGGI,g), gi=iso(d), gs=d.getDay();
    if(!ORARI[gs].ap) continue;
    const o=ORARI[gs];
    attive().forEach(pe=>{
      const c=carico[pe.reparto][gs];
      for(let m=minuti(o.ap); m+30<=minuti(o.ch); m+=30){
        if(rnd()>c) continue;
        const cand=TRATT_DEF.filter(t=>REPARTO_DI_AREA[t.area]===pe.reparto);
        if(!cand.length) continue;
        const t=pesca(cand);
        if(m+t.min>minuti(o.ch)) continue;
        /* la persona e' gia' impegnata in questo intervallo? */
        const scontro=nuovi.some(p=>p.giorno===gi&&p.persona===pe.id
          && minuti(p.ora)<m+t.min && m<minuti(p.ora)+tratt(p.tratt).min);
        if(scontro) continue;
        const passato=g<0||(g===0&&m<OGGI.getHours()*60+OGGI.getMinutes());
        nuovi.push({id:'s'+g+'-'+pe.id+'-'+m, semina:true, giorno:gi, ora:hhmm(m),
          persona:pe.id, tratt:t.id, prezzo:t.prezzo, nome:pesca(NOMI),
          tel:'+39 3'+(Math.floor(rnd()*9)+1)+String(Math.floor(rnd()*9e7+1e7)),
          origine: rnd()<.5?'sito':(rnd()<.5?'telefono':'salone'),
          stato: passato ? (rnd()<.035?'non presentato':'completata') : 'confermata',
          metodo: passato ? pesca(METODI) : null, note:''});
      }
    });
  }
  PREN=PREN.concat(nuovi);
  salva('prenotazioni',PREN);
})();

(function seminaFatture(){
  if(FATTURE.length) return;
  const forn=[['Jurvedha','capelli'],['Joico Italia','capelli'],['Fudge Italia','capelli'],
    ['Nashi Argan','capelli'],['Depot Barbershop','barbershop'],['Beauty Service Lombardia','estetica'],
    ['Nail Supply Milano','estetica']];
  const f=[];
  for(let m=-11;m<=0;m++){
    const base=new Date(OGGI.getFullYear(),OGGI.getMonth()+m,1);
    forn.forEach((fo,i)=>{
      if(rnd()>.72) return;
      const gg=Math.floor(rnd()*24)+2;
      const data=new Date(base.getFullYear(),base.getMonth(),gg);
      const scad=piu(data,30);
      const imp=Math.round((110+rnd()*1250)*100)/100;
      const pagata= m<-1 ? rnd()<.93 : rnd()<.4;
      f.push({id:'f'+m+'-'+i,forn:fo[0],rep:fo[1],
        num:data.getFullYear()+'/'+String(f.length+1).padStart(3,'0'),
        data:iso(data),scad:iso(scad),imp:imp,stato:pagata?'pagata':'aperta'});
    });
  }
  FATTURE=f; salva('fatture',FATTURE);
})();

/* =========================================================
   AGENDA
   ========================================================= */
let giornoVisto=iso(OGGI), vista='settimana', repVisto='tutti';

function disegnaFiltroReparto(){
  $('#filtro-reparto').innerHTML=
    '<button data-r="tutti"'+(repVisto==='tutti'?' class="on"':'')+'>Tutti</button>'
    + REPARTI.map(r=>'<button data-r="'+r[0]+'"'+(repVisto===r[0]?' class="on"':'')+'>'
      +esc(r[1])+'</button>').join('');
  $$('#filtro-reparto button').forEach(b=>b.onclick=()=>{
    repVisto=b.dataset.r; disegnaFiltroReparto(); disegnaAgenda();
  });
}
function rigaOra(dal,al){
  /* riga rossa dell'ora corrente: 50px per ogni mezz'ora, 38px di intestazione */
  const m=OGGI.getHours()*60+OGGI.getMinutes();
  if(m<dal||m>al) return '';
  return '<div class="ora-ora" style="top:'+(38+(m-dal)/30*50)+'px"></div>';
}
function disegnaLegenda(){
  $('#leg').innerHTML=REPARTI.map(r=>
    '<span><i style="background:'+COL_REP[r[0]]+'"></i>'+esc(r[1])+'</span>').join('')
    +'<span><i style="background:#EDE7DE"></i>Chiuso</span>';
}
function disegnaAgenda(){
  disegnaLegenda();
  if(vista==='settimana') disegnaSettimana(); else disegnaGiorno();
}
function fasciaSettimana(gg){
  let dal=24*60, al=0;
  gg.forEach(gi=>{ if(chiuso(gi)) return;
    const o=ORARI[new Date(gi+'T12:00:00').getDay()];
    dal=Math.min(dal,minuti(o.ap)); al=Math.max(al,minuti(o.ch)); });
  if(al<=dal){ dal=9*60; al=20*60; }
  return [dal,al];
}
function bloccoApp(p,ora){
  const t=tratt(p.tratt), pe=persona(p.persona), col=COL_REP[pe.reparto]||'#7D858C';
  return '<div class="bloc'+(p.stato==='completata'?' fatto':'')
    +(p.stato==='annullata'?' annullata':'')+'" data-id="'+esc(p.id)+'" '
    +'style="border-left-color:'+col+';background:color-mix(in srgb,'+col+' 15%,#fff)" '
    +'title="'+esc(p.nome+' · '+t.nome+' · '+pe.nome)+'">'
    +'<u>'+esc(ora)+' '+esc(pe.nome)+'</u><b>'+esc(p.nome)+'</b>'
    +'<small>'+esc(t.nome)+'</small></div>';
}
/* ---------- settimana ---------- */
function lunediDi(gi){ const d=new Date(gi+'T12:00:00'); return piu(d,-((d.getDay()+6)%7)); }
function disegnaSettimana(){
  const lun=lunediDi(giornoVisto), gg=[];
  for(let i=0;i<7;i++) gg.push(iso(piu(lun,i)));
  const a=new Date(gg[0]+'T12:00:00'), b=new Date(gg[6]+'T12:00:00');
  const mA=a.toLocaleDateString('it-IT',{month:'long'}), mB=b.toLocaleDateString('it-IT',{month:'long'});
  $('#giorno-et').textContent='Dal '+a.getDate()+(mA!==mB?' '+mA:'')+' al '+b.getDate()+' '+mB
    +' '+b.getFullYear();
  const f=fasciaSettimana(gg), dal=f[0], al=f[1];
  const oggi=iso(OGGI);
  $('#ag').style.gridTemplateColumns='54px '
    +gg.map(gi=>chiuso(gi)?'60px':'minmax(132px,1fr)').join(' ');
  $('#ag').style.minWidth=(56+gg.reduce((t,gi)=>t+(chiuso(gi)?60:132),0))+'px';
  let h='<div class="ang"></div>';
  gg.forEach(gi=>{
    const d=new Date(gi+'T12:00:00'), ch=chiuso(gi), c=CHIUSURE.find(x=>x.data===gi);
    h+='<div class="dt'+(gi===oggi?' oggi':'')+(ch?' no':'')+'"><span>'+GG[d.getDay()]+'</span>'
      +'<b>'+d.getDate()+'</b>'+(ch?'<small>'+esc(c?c.motivo:'chiuso')+'</small>':'')+'</div>';
  });
  for(let m=dal;m<al;m+=30){
    h+='<div class="oh'+(m%60?' mezza':'')+'">'+hhmm(m)+'</div>';
    gg.forEach(gi=>{
      const o=ORARI[new Date(gi+'T12:00:00').getDay()];
      if(chiuso(gi)||m<minuti(o.ap)||m>=minuti(o.ch)){ h+='<div class="cs no"></div>'; return; }
      const qui=daVedere().filter(p=>p.giorno===gi&&p.ora===hhmm(m)&&p.stato!=='annullata');
      const dentro=qui.slice(0,3).map(p=>bloccoApp(p,hhmm(m))).join('')
        +(qui.length>3?'<div class="bloc altri" data-altri="'+gi+'|'+hhmm(m)+'" '
          +'title="Altri '+(qui.length-3)+' appuntamenti, apri la giornata">+'
          +(qui.length-3)+'</div>':'');
      const libera=personeAttive().find(pe=>!qui.some(p=>p.persona===pe.id));
      h+='<div class="cs"'+(libera?' data-nuovo="'+gi+'|'+hhmm(m)+'|'+libera.id+'"':'')
        +'>'+dentro+'</div>';
    });
  }
  $('#ag').innerHTML=h+(gg.indexOf(iso(OGGI))>=0?rigaOra(dal,al):'');
  legaAgenda();
}
/* ---------- giorno: una colonna per persona ---------- */
function personeAttive(){
  return repVisto==='tutti' ? attive() : dellReparto(repVisto);
}
function daVedere(){
  const ids=personeAttive().map(p=>p.id);
  return PREN.filter(p=>ids.includes(p.persona));
}
function disegnaGiorno(){
  const d=new Date(giornoVisto+'T12:00:00'), o=ORARI[d.getDay()];
  $('#giorno-et').textContent=GIORNI[d.getDay()]+' '+d.getDate()+' '
    +d.toLocaleDateString('it-IT',{month:'long'});
  const gente=personeAttive();
  if(chiuso(giornoVisto)){
    const c=CHIUSURE.find(x=>x.data===giornoVisto);
    $('#ag').style.gridTemplateColumns='1fr';
    $('#ag').style.minWidth='auto';
    $('#ag').innerHTML='<div class="vuoto">Salone chiuso'
      +(c?': '+esc(c.motivo):' in questo giorno della settimana')+'.</div>';
    return;
  }
  $('#ag').style.gridTemplateColumns='54px repeat('+gente.length+',minmax(116px,1fr))';
  $('#ag').style.minWidth=(54+gente.length*116)+'px';
  let h='<div class="ang"></div>';
  gente.forEach(pe=>{
    const n=PREN.filter(p=>p.giorno===giornoVisto&&p.persona===pe.id&&p.stato!=='annullata').length;
    h+='<div class="dt"><b style="font-size:1rem">'+esc(pe.nome)+'</b>'
      +'<span>'+n+' app.</span></div>';
  });
  for(let m=minuti(o.ap);m<minuti(o.ch);m+=30){
    h+='<div class="oh'+(m%60?' mezza':'')+'">'+hhmm(m)+'</div>';
    gente.forEach(pe=>{
      const p=PREN.find(x=>x.giorno===giornoVisto&&x.persona===pe.id&&x.ora===hhmm(m)
        &&x.stato!=='annullata');
      h+= p ? '<div class="cs">'+bloccoApp(p,hhmm(m))+'</div>'
        : '<div class="cs" data-nuovo="'+giornoVisto+'|'+hhmm(m)+'|'+pe.id+'"></div>';
    });
  }
  $('#ag').innerHTML=h+(giornoVisto===iso(OGGI)?rigaOra(minuti(o.ap),minuti(o.ch)):'');
  legaAgenda();
}
function legaAgenda(){
  $$('#ag .bloc[data-id]').forEach(x=>x.onclick=e=>{ e.stopPropagation(); apriApp(x.dataset.id); });
  $$('#ag [data-altri]').forEach(x=>x.onclick=e=>{ e.stopPropagation();
    const v=x.dataset.altri.split('|');
    giornoVisto=v[0]; vista='giorno';
    $$('#vista button').forEach(b=>b.classList.toggle('on',b.dataset.v==='giorno'));
    disegnaAgenda();
  });
  $$('#ag [data-nuovo]').forEach(c=>c.onclick=()=>{
    const v=c.dataset.nuovo.split('|'); nuovoApp(v[0],v[1],v[2]);
  });
}

function foglio(v){ $('#foglio').classList.toggle('on',v);
  document.body.style.overflow=v?'hidden':''; }
function riga(a,b){ return '<div><span>'+esc(a)+'</span>'+esc(b)+'</div>'; }
function apriApp(id){
  const p=PREN.find(x=>x.id===id); if(!p) return;
  const t=tratt(p.tratt), pe=persona(p.persona);
  const d=new Date(p.giorno+'T12:00:00');
  $('#fo-tit').textContent=p.nome;
  $('#fo-sotto').textContent=GIORNI[d.getDay()]+' '+d.getDate()+' '
    +d.toLocaleDateString('it-IT',{month:'long'})+', ore '+p.ora;
  $('#fo-corpo').innerHTML='<div class="dett">'
    +riga('Trattamento',t.nome)
    +riga('Durata',t.min+' minuti')
    +riga('Con',pe.nome+' · '+pe.ruolo)
    +riga('Telefono',p.tel||'non indicato')
    +riga('Origine',p.origine==='sito'?'prenotato dal sito':p.origine)
    +riga('Importo',eur(p.prezzo))
    +riga('Stato',p.stato)
    +(p.metodo?riga('Pagato con',p.metodo):'')
    +'</div>'
    +(p.note?'<p class="nota" style="margin-bottom:12px">'+esc(p.note)+'</p>':'')
    +'<div class="campo"><label for="ed-nota">Nota interna</label>'
    +'<textarea id="ed-nota" rows="2">'+esc(p.nota||'')+'</textarea></div>';
  const az=[];
  if(p.stato==='confermata'){
    az.push('<button class="b b-p b-sm" data-az="fatto">Segna come fatto</button>');
    az.push('<button class="b b-s b-sm" data-az="sposta">Sposta</button>');
    az.push('<button class="b b-ko b-sm" data-az="annulla">Annulla</button>');
  } else if(p.stato==='annullata'){
    az.push('<button class="b b-s b-sm" data-az="ripristina">Rimetti in agenda</button>');
  } else {
    az.push('<button class="b b-s b-sm" data-az="riapri">Riporta a confermato</button>');
  }
  az.push('<button class="b b-s b-sm" data-az="nota">Salva la nota</button>');
  $('#fo-piede').innerHTML=az.join('');
  $$('#fo-piede [data-az]').forEach(b=>b.onclick=()=>azioneApp(p,b.dataset.az));
  foglio(true);
}
function azioneApp(p,az){
  if(az==='fatto'){
    p.stato='completata';
    p.metodo=p.metodo||'contanti';
    avvisa('Appuntamento segnato come fatto, incasso in cassa');
  }
  if(az==='annulla'){ p.stato='annullata'; avvisa('Appuntamento annullato, lo slot torna libero'); }
  if(az==='ripristina'||az==='riapri'){ p.stato='confermata'; p.metodo=null; avvisa('Rimesso in agenda'); }
  if(az==='nota'){ p.nota=$('#ed-nota').value.trim(); avvisa('Nota salvata'); }
  if(az==='sposta'){ foglio(false); nuovoApp(p.giorno,p.ora,p.persona,p); return; }
  salva('prenotazioni',PREN); foglio(false); tutto();
}

/* ---------- nuovo appuntamento, o spostamento ---------- */
function nuovoApp(giorno,ora,personaId,daSpostare){
  const pe=persona(personaId);
  const cand=TRATT.filter(t=>t.attivo!==false&&REPARTO_DI_AREA[t.area]===pe.reparto);
  $('#fo-tit').textContent=daSpostare?'Sposta appuntamento':'Nuovo appuntamento';
  $('#fo-sotto').textContent='Gli orari sono liberi: puoi mettere anche le 10:15.';
  $('#fo-corpo').innerHTML=
   '<div class="campo"><label for="n-cliente">Cliente</label>'
   +'<input id="n-cliente" list="l-clienti" value="'+esc(daSpostare?daSpostare.nome:'')+'" '
   +'placeholder="Nome e cognome"><datalist id="l-clienti">'
   + [...new Set(PREN.map(p=>p.nome))].slice(0,300).map(n=>'<option value="'+esc(n)+'">').join('')
   +'</datalist></div>'
   +'<div class="campo"><label for="n-tel">Telefono</label>'
   +'<input id="n-tel" value="'+esc(daSpostare?daSpostare.tel:'')+'" placeholder="+39"></div>'
   +'<div class="campo"><label for="n-persona">Con chi</label><select id="n-persona">'
   + attive().map(x=>'<option value="'+x.id+'"'+(x.id===personaId?' selected':'')+'>'
     +esc(x.nome)+' · '+esc(x.ruolo)+'</option>').join('')+'</select></div>'
   +'<div class="campo"><label for="n-tratt">Trattamento</label><select id="n-tratt">'
   + cand.map(t=>'<option value="'+t.id+'"'
     +(daSpostare&&daSpostare.tratt===t.id?' selected':'')+'>'
     +esc(t.nome)+' · '+t.min+'′ · '+eur(t.prezzo)+'</option>').join('')+'</select></div>'
   +'<div class="duo">'
   +'<div class="campo"><label for="n-giorno">Giorno</label>'
   +'<input type="date" id="n-giorno" value="'+giorno+'"></div>'
   +'<div class="campo"><label for="n-ora">Ora</label>'
   +'<input type="time" id="n-ora" step="900" value="'+ora+'"></div></div>'
   +'<div class="campo"><label for="n-note">Note</label>'
   +'<textarea id="n-note" rows="2">'+esc(daSpostare?daSpostare.note:'')+'</textarea></div>'
   +'<p class="nota">Gli orari sono liberi: puoi mettere un appuntamento anche a cavallo della '
   +'mezz\'ora, per esempio alle 10:15.</p>';
  $('#fo-piede').innerHTML='<button class="b b-p" id="b-crea">'
    +(daSpostare?'Sposta':'Aggiungi in agenda')+'</button>'
    +'<button class="b b-s" id="b-annulla-crea">Lascia stare</button>';
  /* cambiando persona cambia l'elenco dei trattamenti possibili */
  $('#n-persona').onchange=()=>{
    const r=persona($('#n-persona').value).reparto;
    $('#n-tratt').innerHTML=TRATT.filter(t=>t.attivo!==false&&REPARTO_DI_AREA[t.area]===r)
      .map(t=>'<option value="'+t.id+'">'+esc(t.nome)+' · '+t.min+'′ · '+eur(t.prezzo)
        +'</option>').join('');
  };
  $('#b-annulla-crea').onclick=()=>foglio(false);
  $('#b-crea').onclick=()=>{
    const nome=$('#n-cliente').value.trim();
    if(nome.length<3){ avvisa('Serve il nome del cliente'); return; }
    const t=tratt($('#n-tratt').value), gi=$('#n-giorno').value, or=$('#n-ora').value;
    if(!gi||!or){ avvisa('Serve giorno e ora'); return; }
    const chiId=$('#n-persona').value;
    const scontro=PREN.some(p=>p!==daSpostare&&p.giorno===gi&&p.persona===chiId
      &&p.stato!=='annullata'
      &&minuti(p.ora)<minuti(or)+t.min && minuti(or)<minuti(p.ora)+tratt(p.tratt).min);
    if(scontro){ avvisa('In quel momento '+persona(chiId).nome+' è già occupata'); return; }
    if(daSpostare){
      Object.assign(daSpostare,{giorno:gi,ora:or,persona:chiId,tratt:t.id,prezzo:t.prezzo,
        nome:nome,tel:$('#n-tel').value.trim(),note:$('#n-note').value.trim()});
      avvisa('Appuntamento spostato');
    } else {
      PREN.push({id:'m'+Date.now(),giorno:gi,ora:or,persona:chiId,tratt:t.id,prezzo:t.prezzo,
        nome:nome,tel:$('#n-tel').value.trim(),note:$('#n-note').value.trim(),
        origine:'salone',stato:'confermata',metodo:null});
      avvisa('Appuntamento aggiunto in agenda');
    }
    salva('prenotazioni',PREN);
    giornoVisto=gi; foglio(false); tutto();
  };
  foglio(true);
}

let filtroPren='futuri', ricerca='';
function disegnaPren(){
  const oggi=iso(OGGI);
  let v=PREN.slice();
  if(filtroPren==='futuri')    v=v.filter(p=>p.giorno>=oggi&&p.stato==='confermata');
  if(filtroPren==='oggi')      v=v.filter(p=>p.giorno===oggi);
  if(filtroPren==='passati')   v=v.filter(p=>p.giorno<oggi);
  if(filtroPren==='sito')      v=v.filter(p=>p.origine==='sito');
  if(filtroPren==='annullate') v=v.filter(p=>p.stato==='annullata');
  if(ricerca){ const q=ricerca.toLowerCase();
    v=v.filter(p=>(p.nome+' '+(p.tel||'')).toLowerCase().includes(q)); }
  v.sort((a,b)=>filtroPren==='passati'
    ? (b.giorno+b.ora).localeCompare(a.giorno+a.ora)
    : (a.giorno+a.ora).localeCompare(b.giorno+b.ora));
  $('#conta-pren').textContent=v.length+' voci';
  $('#tab-pren').innerHTML= v.length ? v.slice(0,260).map(p=>{
    const t=tratt(p.tratt), d=new Date(p.giorno+'T12:00:00');
    return '<tr data-id="'+esc(p.id)+'"><td>'+GG[d.getDay()]+' '+d.getDate()+'/'
      +(d.getMonth()+1)+' · '+p.ora+'</td><td>'+esc(p.nome)+'</td><td>'+esc(t.nome)+'</td>'
      +'<td>'+esc(persona(p.persona).nome)+'</td>'
      +'<td>'+(p.origine==='sito'?'<span class="eti eti-web">dal sito</span>':esc(p.origine))+'</td>'
      +'<td class="dx">'+eur(p.prezzo)+'</td><td>'+etichettaStato(p.stato)+'</td></tr>';
  }).join('') : '<tr><td colspan="7"><div class="vuoto">Nessun appuntamento con questo filtro.</div></td></tr>';
  $$('#tab-pren tr[data-id]').forEach(r=>r.onclick=()=>apriApp(r.dataset.id));
  const nuoveDalSito=PREN.filter(p=>p.origine==='sito'&&p.nuova).length;
  const b=$('#n-pren'); b.hidden=!nuoveDalSito; b.textContent=nuoveDalSito;
}
function etichettaStato(s){
  if(s==='completata') return '<span class="eti eti-ok">fatto</span>';
  if(s==='annullata') return '<span class="eti eti-ko">annullato</span>';
  if(s==='non presentato') return '<span class="eti eti-att">non presentato</span>';
  return '<span class="eti eti-neu">confermato</span>';
}
function clienti(){
  const m={};
  PREN.forEach(p=>{
    if(p.stato==='annullata') return;
    const k=p.nome;
    m[k]=m[k]||{nome:p.nome,tel:p.tel,visite:0,speso:0,ultima:'',con:{}};
    m[k].visite++;
    if(p.stato==='completata') m[k].speso+=p.prezzo;
    if(p.giorno>m[k].ultima) m[k].ultima=p.giorno;
    m[k].con[p.persona]=(m[k].con[p.persona]||0)+1;
  });
  return Object.values(m).sort((a,b)=>b.speso-a.speso);
}
function disegnaClienti(){
  let v=clienti();
  if(ricerca){ const q=ricerca.toLowerCase();
    v=v.filter(c=>(c.nome+' '+(c.tel||'')).toLowerCase().includes(q)); }
  $('#conta-cli').textContent=v.length+' persone';
  $('#tab-cli').innerHTML= v.length ? v.slice(0,300).map(c=>{
    const pref=Object.entries(c.con).sort((a,b)=>b[1]-a[1])[0];
    const d=new Date(c.ultima+'T12:00:00');
    return '<tr><td>'+esc(c.nome)+'</td><td>'+esc(c.tel||'')+'</td>'
      +'<td class="dx">'+c.visite+'</td>'
      +'<td>'+d.getDate()+'/'+(d.getMonth()+1)+'/'+String(d.getFullYear()).slice(2)+'</td>'
      +'<td>'+esc(persona(pref[0]).nome)+'</td><td class="dx">'+eur(c.speso)+'</td></tr>';
  }).join('') : '<tr><td colspan="6"><div class="vuoto">Nessun cliente trovato.</div></td></tr>';
}

let convVista='c1';
function disegnaConv(){
  $('#wa-el').innerHTML=CONV.map(c=>

    +(c.umano?'presa in carico':'risponde l\'assistente')+'</small></div>').join('');
  $$('#wa-el .v').forEach(v=>v.onclick=()=>{
    convVista=v.dataset.c;
    const c=CONV.find(x=>x.id===convVista); c.nonLetti=0;

  $('#wa-top').innerHTML='<div><b style="font-weight:400">'+esc(c.nome)+'</b>'
    +'<div style="font-size:.76rem;color:var(--tx3)">'+esc(c.tel)+'</div></div>'
    +'<div style="margin-left:auto;display:flex;gap:7px;flex-wrap:wrap">'
    +'<button class="b '+(c.umano?'b-s':'b-p')+' b-sm" id="wa-umano">'
    +(c.umano?'Torna all\'assistente':'Prendo in carico io')+'</button>'
    +'<button class="b b-s b-sm" id="wa-app">Apri in agenda</button></div>';
  $('#wa-msg').innerHTML=c.msg.map(m=>{
    if(m[0]==='sis') return '<div class="wa-b sis">'+esc(m[1])+'</div>';
    const chi=m[0]==='bot'?'Assistente':(m[0]==='noi'?'Salone':'');
    return '<div class="wa-b '+(m[0]==='cli'?'':'noi')+'">'
      +(chi?'<span class="chi">'+chi+'</span>':'')+esc(m[1])
      +'<div style="font-size:.66rem;opacity:.5;text-align:right">'+esc(m[2])+'</div></div>';
  }).join('');
  $('#wa-msg').scrollTop=9e5;
  $('#wa-rap').innerHTML=['Le confermo l\'appuntamento','Le mando le disponibilità',
    'Purtroppo in quell\'orario siamo pieni','Grazie, a presto']
    .map(t=>'<button data-r="'+esc(t)+'">'+esc(t)+'</button>').join('');
  $$('#wa-rap button').forEach(b=>b.onclick=()=>{ $('#wa-testo').value=b.dataset.r; });
  $('#wa-umano').onclick=()=>{
    c.umano=!c.umano;
    c.msg.push(['sis',c.umano?'Presa in carico dal salone':'Torna a rispondere l\'assistente',adesso()]);
    disegnaConv();
    avvisa(c.umano?'Rispondi tu, l\'assistente si ferma su questa chat'
      :'Torna a rispondere l\'assistente');
  };
  $('#wa-app').onclick=()=>{
    const p=PREN.filter(x=>x.nome===c.nome&&x.giorno>=iso(OGGI)).sort((a,b)=>
      (a.giorno+a.ora).localeCompare(b.giorno+b.ora))[0];
    if(!p){ avvisa('Nessun appuntamento futuro per '+c.nome); return; }
    giornoVisto=p.giorno; vaiA('agenda'); disegnaAgenda(); apriApp(p.id);
  };
  contaWa();
}
function adesso(){ const d=new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function contaWa(){
  const n=CONV.reduce((t,c)=>t+c.nonLetti,0);
  const b=$('#n-wa'); b.hidden=!n; b.textContent=n;
  $('#conta-conv').textContent=CONV.length+' conversazioni';
}
function inviaWa(){
  const t=$('#wa-testo').value.trim(); if(!t) return;
  const c=CONV.find(x=>x.id===convVista);
  c.msg.push([c.umano?'noi':'bot',t,adesso()]);
  $('#wa-testo').value='';
  disegnaConv();
}

/* =========================================================
   INCASSI E PREVISIONE
   ========================================================= */
function meseId(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function incassoMese(m){
  return PREN.filter(p=>mese(p.giorno)===m&&p.stato==='completata')
    .reduce((t,p)=>t+p.prezzo,0);
}
function giorniLavorati(m){
  return new Set(PREN.filter(p=>mese(p.giorno)===m&&p.stato==='completata')
    .map(p=>p.giorno)).size;
}
function giorniApertiDelMese(anno,m){
  let n=0;
  const gg=new Date(anno,m+1,0).getDate();
  for(let i=1;i<=gg;i++){
    const d=new Date(anno,m,i,12);
    if(!chiuso(iso(d))) n++;
  }
  return n;
}
function previsione(){
  const pros=new Date(OGGI.getFullYear(),OGGI.getMonth()+1,1);
  const prec=new Date(OGGI.getFullYear(),OGGI.getMonth()-1,1);
  const prec2=new Date(OGGI.getFullYear(),OGGI.getMonth()-2,1);
  const mPros=meseId(pros), mPrec=meseId(prec), mPrec2=meseId(prec2);
  const iPrec=incassoMese(mPrec), iPrec2=incassoMese(mPrec2);
  const gLav=giorniLavorati(mPrec)||1;
  const mediaGiorno=iPrec/gLav;
  let tend=iPrec2>0?iPrec/iPrec2:1;
  tend=Math.max(.85,Math.min(1.15,tend));
  const gAperti=giorniApertiDelMese(pros.getFullYear(),pros.getMonth());
  const stima=mediaGiorno*gAperti*tend;
  const gia=PREN.filter(p=>mese(p.giorno)===mPros&&p.stato==='confermata')
    .reduce((t,p)=>t+p.prezzo,0);
  return {stima:stima,gia:gia,mediaGiorno:mediaGiorno,gAperti:gAperti,tend:tend,
    mPrec:mPrec,iPrec:iPrec,gLav:gLav,mPros:mPros};
}
function disegnaIncassi(){
  const mOra=meseId(OGGI), p=previsione();
  const iOra=incassoMese(mOra);
  $('#i-mese').textContent=eur(iOra);
  $('#i-mese-s').textContent=giorniLavorati(mOra)+' giornate lavorate finora';
  $('#i-prec').textContent=eur(p.iPrec);
  $('#i-prec-s').textContent=p.gLav+' giornate, media '+eur(p.mediaGiorno)+' al giorno';
  $('#i-pros').textContent=eur(p.stima);
  $('#i-pros-s').textContent=p.gAperti+' giorni di apertura, tendenza '
    +(p.tend>=1?'+':'')+Math.round((p.tend-1)*100)+'%';
  $('#i-gia').textContent=eur(p.gia);

  /* sei mesi indietro piu' la previsione */
  const mesi=[];
  for(let i=5;i>=0;i--){
    const d=new Date(OGGI.getFullYear(),OGGI.getMonth()-i,1);
    mesi.push({et:d.toLocaleDateString('it-IT',{month:'short'}),v:incassoMese(meseId(d)),pros:false});
  }
  const dPros=new Date(OGGI.getFullYear(),OGGI.getMonth()+1,1);
  mesi.push({et:dPros.toLocaleDateString('it-IT',{month:'short'}),v:p.stima,pros:true});
  const max=Math.max.apply(null,mesi.map(m=>m.v))||1;
  $('#barre').innerHTML=mesi.map(m=>
    '<div class="col'+(m.pros?' pros':'')+'"><b>'+eur(m.v)+'</b>'
    +'<i style="height:'+Math.max(3,Math.round(m.v/max*100))+'%"></i>'
    +'<span>'+esc(m.et)+'</span></div>').join('');
  $('#spiega-prev').textContent='La previsione non è un numero a caso: prende la media giornaliera '
    +'del mese scorso ('+eur(p.mediaGiorno)+'), la moltiplica per i '+p.gAperti+' giorni in cui il '
    +'salone sarà aperto il mese prossimo, e la corregge con la tendenza fra gli ultimi due mesi ('
    +(p.tend>=1?'+':'')+Math.round((p.tend-1)*100)+'%). Le chiusure che segni negli orari entrano '
    +'subito nel conto. Dei '+eur(p.stima)+' previsti, '+eur(p.gia)+' sono già in agenda.';

  /* diviso per reparto */
  const delMese=PREN.filter(x=>mese(x.giorno)===mOra&&x.stato==='completata');
  const perRep={};
  REPARTI.forEach(r=>perRep[r[0]]=0);
  delMese.forEach(x=>{ perRep[persona(x.persona).reparto]+=x.prezzo; });
  const tot=Object.values(perRep).reduce((a,b)=>a+b,0)||1;
  $('#quota-rep').innerHTML=REPARTI.map(r=>{
    const q=perRep[r[0]]/tot*100;
    return q<1?'':'<div style="width:'+q.toFixed(1)+'%;background:'+COL_REP[r[0]]+'">'
      +Math.round(q)+'%</div>';
  }).join('');
  $('#righe-rep').innerHTML=REPARTI.map(r=>
    '<div class="riga-p"><span>'+esc(r[1])+'</span><b>'+eur(perRep[r[0]])+'</b></div>').join('')
    +'<div class="riga-p"><span>Totale del mese</span><b>'+eur(tot===1?0:tot)+'</b></div>';

  /* chi ha incassato */
  const perPersona={};
  delMese.forEach(x=>{ perPersona[x.persona]=(perPersona[x.persona]||0)+x.prezzo; });
  const ord=Object.entries(perPersona).sort((a,b)=>b[1]-a[1]);
  $('#righe-persone').innerHTML= ord.length ? ord.map(e=>
    '<div class="riga-p"><span>'+esc(persona(e[0]).nome)+'<span style="color:var(--tx3)"> · '
    +esc(persona(e[0]).ruolo)+'</span></span><b>'+eur(e[1])+'</b></div>').join('')
    : '<div class="vuoto">Ancora nessun incasso questo mese.</div>';

  /* metodi di pagamento */
  const perMetodo={};
  delMese.forEach(x=>{ const m=x.metodo||'contanti';
    perMetodo[m]=(perMetodo[m]||0)+x.prezzo; });
  $('#righe-metodi').innerHTML=Object.entries(perMetodo).sort((a,b)=>b[1]-a[1]).map(e=>
    '<div class="riga-p"><span>'+esc(e[0])+'</span><b>'+eur(e[1])+' · '
    +Math.round(e[1]/(tot===1?1:tot)*100)+'%</b></div>').join('')
    || '<div class="vuoto">Nessun incasso registrato.</div>';
}

/* =========================================================
   ASSISTENTE
   ========================================================= */
function consigli(){
  const out=[], oggi=iso(OGGI);
  /* 1. buchi in agenda nei prossimi giorni */
  let peggio=null;
  for(let g=0;g<7;g++){
    const gi=iso(piu(OGGI,g));
    if(chiuso(gi)) continue;
    const o=ORARI[new Date(gi+'T12:00:00').getDay()];
    const slot=Math.floor((minuti(o.ch)-minuti(o.ap))/30)*attive().length;
    const usati=PREN.filter(p=>p.giorno===gi&&p.stato!=='annullata').length;
    const liberi=slot-usati;
    if(!peggio||liberi>peggio.liberi) peggio={gi:gi,liberi:liberi,slot:slot};
  }
  if(peggio&&peggio.liberi>peggio.slot*.45){
    const d=new Date(peggio.gi+'T12:00:00');
    out.push({t:'Agenda scarica '+(peggio.gi===oggi?'oggi':GIORNI[d.getDay()].toLowerCase()+' '+d.getDate()),
      p:'Restano '+peggio.liberi+' caselle libere su '+peggio.slot+'. Un messaggio ai clienti che '
        +'non passano da più di due mesi di solito riempie mezza giornata.',
      az:[['Apri quel giorno',()=>{ giornoVisto=peggio.gi; vista='giorno';
        $$('#vista button').forEach(b=>b.classList.toggle('on',b.dataset.v==='giorno'));
        vaiA('agenda'); disegnaAgenda(); },true],
        ['Vedi le conversazioni',()=>vaiA('whatsapp'),false]]});
  }
  /* 2. messaggi da leggere */
  const nonLetti=CONV.reduce((t,c)=>t+c.nonLetti,0);
  if(nonLetti) out.push({t:nonLetti+' messaggi WhatsApp da leggere',
    p:'L\'assistente ha già risposto su prezzi e disponibilità, ma qualche richiesta aspetta una '
      +'conferma vostra.',
    az:[['Apri le conversazioni',()=>vaiA('whatsapp'),true]]});
  /* 3. prodotti sotto scorta */
  const bassi=sottoScorta();
  if(bassi.length) out.push({t:bassi.length+' prodotti sotto la scorta minima',
    p:bassi.slice(0,3).map(p=>p.nome+' ('+p.q+')').join(', ')
      +(bassi.length>3?' e altri '+(bassi.length-3):'')+'. Conviene ordinare prima del fine settimana.',
    az:[['Apri il magazzino',()=>vaiA('magazzino'),true]]});
  /* 4. fatture scadute */
  const scadute=FATTURE.filter(f=>f.stato==='aperta'&&f.scad<oggi);
  if(scadute.length) out.push({t:scadute.length+' fatture fornitori scadute',
    p:'In totale '+eur(scadute.reduce((t,f)=>t+f.imp,0))+'. La più vecchia è di '
      +esc(scadute.sort((a,b)=>a.scad.localeCompare(b.scad))[0].forn)+'.',
    az:[['Apri le fatture',()=>vaiA('fornitori'),true]]});
  /* 5. clienti che non tornano */
  const limite=iso(piu(OGGI,-75));
  const persi=clienti().filter(c=>c.ultima<limite&&c.visite>=3);
  if(persi.length) out.push({t:persi.length+' clienti abituali non tornano da oltre due mesi',
    p:'Erano venuti almeno tre volte. Valgono in media '+eur(persi.reduce((t,c)=>t+c.speso,0)
      /persi.length)+' a testa di storico.',
    az:[['Vedi i clienti',()=>vaiA('clienti'),true]]});
  /* 6. previsione */
  const p=previsione();
  out.push({t:'Il mese prossimo dovreste chiudere intorno a '+eur(p.stima),
    p:'Media di '+eur(p.mediaGiorno)+' al giorno per '+p.gAperti+' giorni di apertura, corretta con '
      +'la tendenza degli ultimi due mesi. In agenda ci sono già '+eur(p.gia)+'.',
    az:[['Vedi gli incassi',()=>vaiA('incassi'),false]]});
  return out;
}

  const slot= o.ap ? Math.floor((minuti(o.ch)-minuti(o.ap))/30)*attive().length : 0;
  $('#k-occ').textContent=(slot?Math.round(app.length/slot*100):0)+'%';
  const set=iso(piu(OGGI,-7));
  $('#k-web').textContent=PREN.filter(p=>p.origine==='sito'&&p.giorno>=set&&p.giorno<=oggi).length;
}
function disegnaProssimi(){
  const ora=hhmm(OGGI.getHours()*60+OGGI.getMinutes()), oggi=iso(OGGI);
  const v=PREN.filter(p=>p.stato==='confermata'
      &&(p.giorno>oggi||(p.giorno===oggi&&p.ora>=ora)))
    .sort((a,b)=>(a.giorno+a.ora).localeCompare(b.giorno+b.ora)).slice(0,6);
  $('#prossimi').innerHTML= v.length ? v.map(p=>{
    const d=new Date(p.giorno+'T12:00:00');
    return '<div class="pross" data-id="'+esc(p.id)+'"><span class="o">'+p.ora+'</span>'
      +'<div><b>'+esc(p.nome)+'</b><small>'+esc(tratt(p.tratt).nome)+' · '
      +esc(persona(p.persona).nome)+(p.giorno!==oggi?' · '+GG[d.getDay()]+' '+d.getDate():'')
      +'</small></div></div>';
  }).join('') : '<div class="vuoto">Nessun appuntamento in arrivo.</div>';
  $$('#prossimi .pross').forEach(x=>x.onclick=()=>apriApp(x.dataset.id));
}
const TITOLI={agenda:'Agenda',prenotazioni:'Appuntamenti',clienti:'Clienti',
  whatsapp:'Conversazioni WhatsApp',trattamenti:'Listino',squadra:'Squadra',
  orari:'Orari e chiusure',incassi:'Incassi e previsioni',magazzino:'Magazzino',
  fornitori:'Fatture fornitori'};
function vaiA(p){
  $$('.pagina').forEach(s=>s.hidden=(s.id!=='p-'+p));
  $$('#schede button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  document.title='Gestionale · '+TITOLI[p]+' · Naïf';
  scrollTo({top:0,behavior:'smooth'});
}
function avvisa(t){
  $('#toast').textContent=t;
  $('#toast').classList.add('on');
  clearTimeout(avvisa.t);
  avvisa.t=setTimeout(()=>$('#toast').classList.remove('on'),4600);
}
function tutto(){
  disegnaKpi(); disegnaFiltroReparto(); disegnaAgenda(); disegnaPren(); disegnaClienti();
  disegnaFiltriTr(); disegnaTratt(); disegnaSquadra(); disegnaOrari(); disegnaIncassi();
  disegnaMagazzino(); disegnaForn(); disegnaAssistente(); disegnaProssimi();
}

(function(){
  $('#data-oggi').textContent=OGGI.toLocaleDateString('it-IT',
    {weekday:'long',day:'numeric',month:'long',year:'numeric'});
  disegnaConv(); tutto();

  $$('#schede button').forEach(b=>b.onclick=()=>vaiA(b.dataset.p));
  $('#fo-x').onclick=()=>foglio(false);
  $('#foglio').onclick=e=>{ if(e.target===$('#foglio')) foglio(false); };
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') foglio(false); });
  $('#sp-chiudi').onclick=()=>document.body.classList.add('spalla-giu');
  $('#sp-apri').onclick=()=>document.body.classList.remove('spalla-giu');

  $('#q').addEventListener('input',e=>{ ricerca=e.target.value.trim();
    disegnaPren(); disegnaClienti(); });
  $$('#filtri-pren button').forEach(b=>b.onclick=()=>{
    filtroPren=b.dataset.f;
    $$('#filtri-pren button').forEach(x=>x.classList.toggle('on',x===b));
    disegnaPren();
  });
  $$('#filtri-forn button').forEach(b=>b.onclick=()=>{
    filtroForn=b.dataset.f;
    $$('#filtri-forn button').forEach(x=>x.classList.toggle('on',x===b));
    disegnaForn();
  });
  $$('#vista button').forEach(b=>b.onclick=()=>{
    vista=b.dataset.v;
    $$('#vista button').forEach(x=>x.classList.toggle('on',x===b));
    disegnaAgenda();
  });
  const passo=n=>{ const q=vista==='settimana'?7:1;
    giornoVisto=iso(piu(new Date(giornoVisto+'T12:00:00'),n*q)); disegnaAgenda(); };
  $('#g-prima').onclick=()=>passo(-1);
  $('#g-dopo').onclick=()=>passo(1);
  $('#g-oggi').onclick=()=>{ giornoVisto=iso(OGGI); disegnaAgenda(); };
  $('#b-nuovo').onclick=()=>nuovoApp(giornoVisto,'10:00',attive()[0].id);
  $('#b-nuovo-tratt').onclick=()=>modificaTratt(null);
  $('#b-nuova-persona').onclick=()=>modificaPersona(null);
  $('#b-nuovo-prod').onclick=()=>modificaProdotto(null);
  $('#b-nuova-fatt').onclick=nuovaFattura;
  $('#b-salva-orari').onclick=salvaOrari;
  $('#b-chiusura').onclick=()=>{
    const d=$('#ch-data').value;
    if(!d){ avvisa('Scegli il giorno da chiudere'); return; }
    CHIUSURE.push({data:d,motivo:$('#ch-motivo').value.trim()||'chiusura'});
    salva('chiusure',CHIUSURE); $('#ch-data').value=''; $('#ch-motivo').value='';
    tutto(); avvisa('Chiusura aggiunta, il sito non accetta più prenotazioni per quel giorno');
  };
  $('#wa-invia').onclick=inviaWa;
  $('#wa-testo').addEventListener('keydown',e=>{ if(e.key==='Enter') inviaWa(); });

  /* se il sito prenota mentre il gestionale è aperto */
  addEventListener('storage',e=>{
    if(String(e.key||'').startsWith('naif_')){
      leggi(); tutto();
      avvisa('È arrivata una prenotazione dal sito');
    }
  });
})();
</script>
